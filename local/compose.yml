version: "3.8"
name: uonix-local

services:
  db:
    platform: linux/arm64
    image: mariadb:10.11
    container_name: uonix-local-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: uonix_db
      MYSQL_USER: uonix_user
      MYSQL_PASSWORD: uonix_pass
    volumes:
      - db_data:/var/lib/mysql:z

  wordpress:
    platform: linux/arm64
    image: wordpress:php8.2-apache
    container_name: uonix-local-app
    restart: unless-stopped
    depends_on:
      - db
      - mailpit
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: uonix_user
      WORDPRESS_DB_PASSWORD: uonix_pass
      WORDPRESS_DB_NAME: uonix_db
      WORDPRESS_TABLE_PREFIX: wpis_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8080' );
        define( 'WP_SITEURL', 'http://localhost:8080' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_CACHE', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
        @ini_set( 'display_errors', 0 );
    volumes:
      - wordpress_core:/var/www/html:z
      - ./wp-content:/var/www/html/wp-content:z
      - ../themes/kadence-child:/var/www/html/wp-content/themes/kadence-child:z
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins:z
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:z
      # SSH para o Remote Explorer do Antigravity/VS Code (provisionado no boot)
      - ./ssh/entrypoint-ssh.sh:/usr/local/bin/entrypoint-ssh.sh:ro
      - ./ssh/provision-ssh.sh:/usr/local/bin/provision-ssh.sh:ro
      - ./ssh/authorized_keys:/run/secrets/uonix_authorized_keys:ro
      - ./ssh/authorized_keys.example:/run/secrets/uonix_authorized_keys_example:ro

    # Sobe o sshd antes de delegar para o entrypoint oficial do WordPress.
    entrypoint:
      - /usr/local/bin/entrypoint-ssh.sh
    command:
      - apache2-foreground

  wpcli:
    profiles:
      - tools
    platform: linux/arm64

    image: wordpress:cli-php8.2
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: uonix_user
      WORDPRESS_DB_PASSWORD: uonix_pass
      WORDPRESS_DB_NAME: uonix_db
      WORDPRESS_TABLE_PREFIX: wpis_
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8080' );
        define( 'WP_SITEURL', 'http://localhost:8080' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_CACHE', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
        @ini_set( 'display_errors', 0 );
    volumes:
      - wordpress_core:/var/www/html:z
      - ./wp-content:/var/www/html/wp-content:z
      - ../themes/kadence-child:/var/www/html/wp-content/themes/kadence-child:z
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins:z
    working_dir: /var/www/html
    entrypoint:
      - php
      - -d
      - memory_limit=512M
      - /usr/local/bin/wp

  mailpit:
    platform: linux/arm64
    image: axllent/mailpit:latest
    container_name: uonix-local-mailpit
    restart: unless-stopped
    hostname: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
    name: uonix-site_db_data
  wordpress_core:
    name: uonix-site_wordpress_core
