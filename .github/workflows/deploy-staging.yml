name: Deploy Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Kadence Child to staging
    runs-on: ubuntu-latest

    env:
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      STAGING_PATH: ${{ vars.STAGING_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate variables and secrets
        run: |
          test -n "$STAGING_SSH_HOST" || (echo "Missing variable STAGING_SSH_HOST" && exit 1)
          test -n "$STAGING_SSH_USER" || (echo "Missing variable STAGING_SSH_USER" && exit 1)
          test -n "$STAGING_PATH" || (echo "Missing variable STAGING_PATH" && exit 1)
          test -n "${{ secrets.STAGING_SSH_KEY }}" || (echo "Missing secret STAGING_SSH_KEY" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p 22 -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p 22 -i ~/.ssh/staging_key \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "echo SSH connection OK"

      - name: Deploy theme to staging
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='._*' \
            -e "ssh -p 22 -i ~/.ssh/staging_key" \
            themes/kadence-child/ \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_PATH/"

      - name: Clear staging page cache
        run: |
          ssh -p 22 -i ~/.ssh/staging_key \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "set -e;
             theme_path='$STAGING_PATH';
             wp_content_dir=\$(dirname \"\$(dirname \"\$theme_path\")\");
             wp_root_dir=\$(dirname \"\$wp_content_dir\");
             speedycache_dir=\"\$wp_content_dir/cache/speedycache\";

             if [ -d \"\$speedycache_dir\" ]; then
               find \"\$speedycache_dir\" -mindepth 1 -maxdepth 1 -exec rm -rf {} +;
               echo \"SpeedyCache cleared: \$speedycache_dir\";
             else
               echo \"SpeedyCache directory not found: \$speedycache_dir\";
             fi;

             if command -v wp >/dev/null 2>&1; then
               wp --path=\"\$wp_root_dir\" cache flush || true;
             fi"
