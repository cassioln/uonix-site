name: Deploy Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Kadence Child to staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/staging_key \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "echo SSH connection OK"

      - name: Deploy theme to staging
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='._*' \
            -e "ssh -i ~/.ssh/staging_key" \
            themes/kadence-child/ \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_PATH }}/"
