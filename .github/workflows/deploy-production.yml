name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite PUBLICAR <SHA> EM UONIX.COM.BR
        required: true
        type: string
      migrate_variation_technical_sheet:
        description: Executar dry-run e migração das fichas legadas por variação
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uonix-environment-prod
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize canonical production request
    runs-on: ubuntu-latest
    env:
      UONIX_ENABLE_DEPLOY_PRODUCTION: ${{ vars.ENABLE_DEPLOY_PRODUCTION }}
      UONIX_PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
      UONIX_REQUEST_SHA: ${{ github.sha }}
      UONIX_REQUEST_REF: ${{ github.ref }}
      UONIX_MIGRATE_VARIATION_TECHNICAL_SHEET: ${{ inputs.migrate_variation_technical_sheet }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate production request and canonical target
        run: |
          set -euo pipefail
          [ "$UONIX_ENABLE_DEPLOY_PRODUCTION" = true ]
          [ "$UONIX_REQUEST_REF" = 'refs/heads/master' ]
          case "$UONIX_REQUEST_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
          [ "${#UONIX_REQUEST_SHA}" -eq 40 ]
          expected_confirmation="PUBLICAR ${UONIX_REQUEST_SHA} EM UONIX.COM.BR"
          [ "$UONIX_PRODUCTION_CONFIRMATION" = "$expected_confirmation" ]
          case "$UONIX_MIGRATE_VARIATION_TECHNICAL_SHEET" in true|false) ;; *) exit 1 ;; esac
          [ "$LOCAWEB_SSH_HOST" = 'ftp.uonix.com.br' ]
          [ "$LOCAWEB_SSH_PORT" = '22' ]
          [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
          [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
          [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
          [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
          [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
          [ "$TARGET_URL" = 'https://uonix.com.br' ]

  validate:
    name: Validate before production
    needs: authorize
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy managed code to Locaweb
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: production-locaweb
    env:
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_LOCK_ACQUIRED: 'false'

    steps:
      - name: Validate canonical production target before credentials
        run: |
          set -euo pipefail
          [ "$LOCAWEB_SSH_HOST" = 'ftp.uonix.com.br' ]
          [ "$LOCAWEB_SSH_PORT" = '22' ]
          [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
          [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
          [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
          [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
          [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
          [ "$TARGET_URL" = 'https://uonix.com.br' ]
          case "$DEPLOY_RUN_ID" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install SSH and rsync tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync sshpass

      - name: Pin known_hosts after canonical validation
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$LOCAWEB_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/locaweb_known_hosts"
          chmod 600 "$HOME/.ssh/locaweb_known_hosts"
          # Mesma razão do reusable do HostGator: o job contata o host várias
          # vezes em sequência e um firewall pode tratar a rajada como abuso,
          # recusando a porta no meio do deploy e deixando lock órfão. Aqui o
          # risco é maior, porque é produção. A multiplexação faz o host ver uma
          # única conexão. %C encurta o socket e evita estourar o limite do
          # caminho UNIX, que desligaria a multiplexação em silêncio.
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host $LOCAWEB_SSH_HOST
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 120
            ServerAliveInterval 30
            ServerAliveCountMax 4
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Preflight SSH window before any remote write
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            -o ConnectTimeout=15 \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          test -d "$document_root"
          command -v rsync >/dev/null
          command -v sha256sum >/dev/null
          test -x "$php_bin"
          test -f "$wp_bin"
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          REMOTE
          then
            echo 'SSH Locaweb indisponível ou WordPress ainda não preparado. Habilite a janela SSH por 3 horas; nenhum arquivo foi alterado.' >&2
            exit 1
          fi

      - name: Build deterministic deploy bundle
        run: scripts/prepare-deploy-bundle.sh --environment=production --output=.deploy

      - name: Acquire exclusive production lock
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          lock_path="$1"
          run_id="$2"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          mkdir -- "$lock_path"
          if ! ( set -o noclobber; umask 077; printf '%s\n' "$run_id" > "$lock_path/owner" ); then
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path" 2>/dev/null || true
            exit 1
          fi
          if ! {
            test ! -L "$lock_path/owner"
            test -f "$lock_path/owner"
            test "$(file_mode "$lock_path/owner")" = 600
            test "$(cat "$lock_path/owner")" = "$run_id"
          }; then
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path" 2>/dev/null || true
            exit 1
          fi
          REMOTE
          printf 'DEPLOY_LOCK_ACQUIRED=true\n' >> "$GITHUB_ENV"

      - name: Back up managed remote paths
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          backup_id="$DEPLOY_RUN_ID"
          backup_dir="$LOCAWEB_ACCOUNT_ROOT/_uonix-deploy-backups/$backup_id"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$backup_dir" <<'REMOTE'
          set -euo pipefail
          umask 077
          shopt -s nullglob
          document_root="$1"
          backup_dir="$2"
          managed="$backup_dir/managed"

          # O nome deriva da execução e o diretório deve nascer vazio. Reutilizar
          # um diretório existente permite seguir/truncar um manifesto preexistente
          # (inclusive symlink); falhamos em vez de reaproveitar qualquer artefato.
          mkdir -- "$backup_dir"
          mkdir -- "$managed" "$managed/themes" "$managed/mu-plugins"

          validate_managed_root() {
            root="$1"
            if [ -L "$root" ]; then
              return 1
            fi
            if [ -f "$root" ]; then
              return 0
            fi
            if [ -d "$root" ]; then
              nested_link="$(find "$root" -type l -print -quit)"
              [ -z "$nested_link" ] || return 1
              return 0
            fi
            [ ! -e "$root" ]
          }

          theme_root="$document_root/wp-content/themes/kadence-child"
          core_root="$document_root/wp-content/mu-plugins/uonix-core.php"
          validate_managed_root "$theme_root"
          validate_managed_root "$core_root"
          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            validate_managed_root "$module"
          done

          if [ -e "$theme_root" ]; then
            cp -a "$theme_root" "$managed/themes/"
          fi

          if [ -e "$core_root" ]; then
            cp -a "$core_root" "$managed/mu-plugins/"
          fi

          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            cp -a "$module" "$managed/mu-plugins/"
          done

          write_managed_manifest() {
            base="$1"
            output="$2"
            roots=("$base/themes/kadence-child" "$base/mu-plugins/uonix-core.php")
            for module in "$base"/mu-plugins/uonix-*; do
              [ -d "$module" ] && roots+=("$module")
            done

            path_list="$(mktemp "${output}.paths.XXXXXX")"
            sorted_list="$(mktemp "${output}.sorted.XXXXXX")"
            : > "$path_list"
            for root in "${roots[@]}"; do
              if [ -L "$root" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
              if [ -f "$root" ]; then
                printf '%s\n' "$root" >> "$path_list"
              elif [ -d "$root" ]; then
                nested_link="$(find "$root" -type l -print -quit)"
                if [ -n "$nested_link" ]; then
                  rm -f -- "$path_list" "$sorted_list"
                  return 1
                fi
                find "$root" -type f -print >> "$path_list"
              elif [ -e "$root" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
            done
            LC_ALL=C sort -u "$path_list" > "$sorted_list"
            if ! ( set -o noclobber; : > "$output" ); then
              rm -f -- "$path_list" "$sorted_list"
              return 1
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if [ -L "$file" ] || [ ! -f "$file" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
              relative="${file#"$base"/}"
              checksum="$(sha256sum "$file" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "$checksum" "$relative" >> "$output"
            done < "$sorted_list"
            rm -f -- "$path_list" "$sorted_list"
            chmod 600 "$output"
          }

          write_managed_manifest "$managed" "$backup_dir/manifest.backup.sha256"
          test -s "$backup_dir/manifest.backup.sha256"
          REMOTE

          printf 'BACKUP_ID=%s\n' "$backup_id" >> "$GITHUB_ENV"
          printf 'BACKUP_DIR=%s\n' "$backup_dir" >> "$GITHUB_ENV"
          printf 'Backup de código criado: %s\n' "$backup_id"

      # O snapshot precisa preceder a publicação: código novo pode alterar schema
      # ao ser carregado. Sua existência, porém, não autoriza rebobinar o banco por
      # uma falha somente de arquivos; o rollback exige marcador real de mutação.
      - name: Back up the production database
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
          LOCAWEB_SSH_PASSWORD_FILE: ${{ runner.temp }}/locaweb-ssh-password
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SSHPASS" > "$LOCAWEB_SSH_PASSWORD_FILE"
          chmod 600 "$LOCAWEB_SSH_PASSWORD_FILE"
          trap 'rm -f "$LOCAWEB_SSH_PASSWORD_FILE"' EXIT

          # $HOME precisa ser expandido pelo SHELL, não por uma expressão de
          # template do Actions: o contexto `env` não conhece HOME e resolveria
          # para string vazia, gerando o caminho "/.ssh/locaweb_known_hosts".
          export LOCAWEB_SSH_KNOWN_HOSTS_FILE="$HOME/.ssh/locaweb_known_hosts"

          scripts/backup-remote-database.sh \
            --environment=production \
            --output-dir="$BACKUP_DIR" \
            --backup-id="$BACKUP_ID" | tee "$RUNNER_TEMP/db-backup.out"

          db_backup_file="$(sed -n 's/^DB_BACKUP_FILE=//p' "$RUNNER_TEMP/db-backup.out")"
          test -n "$db_backup_file"
          printf 'DB_BACKUP_FILE=%s\n' "$db_backup_file" >> "$GITHUB_ENV"
          printf 'Backup de banco criado: %s\n' "${db_backup_file##*/}"

      - name: Publish only managed paths and verify manifest
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          remote="$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST"
          ssh_transport="sshpass -e ssh -p $LOCAWEB_SSH_PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/locaweb_known_hosts"
          operation_lock="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"

          # Valide integralmente o bundle antes de criar o marcador ou iniciar
          # qualquer transferência mutável. Array vazio não pode significar
          # "remova todos os módulos" no destino.
          expected_modules=()
          for module in .deploy/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            module_name="$(basename "$module")"
            case "$module_name" in
              uonix-*[!A-Za-z0-9._-]*|uonix-|uonix-.|uonix-..)
                printf 'ERRO: nome de módulo inválido no bundle: %s\n' "$module_name" >&2
                exit 1
                ;;
              uonix-*) ;;
              *)
                printf 'ERRO: nome de módulo inválido no bundle: %s\n' "$module_name" >&2
                exit 1
                ;;
            esac
            expected_modules+=("$module_name")
          done
          if [ "${#expected_modules[@]}" -eq 0 ]; then
            printf 'ERRO: allowlist de módulos vazia; bundle inválido, nada foi publicado.\n' >&2
            exit 1
          fi

          # O marcador remoto é criado antes do primeiro rsync. Rollback e release
          # consultam este arquivo para não restaurar código quando nenhuma
          # transferência mutável chegou a começar.
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$operation_lock" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          lock_path="$1"
          run_id="$2"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          test -f "$lock_path/owner"
          test ! -L "$lock_path/owner"
          test "$(file_mode "$lock_path/owner")" = 600
          test "$(cat "$lock_path/owner")" = "$run_id"
          marker="$lock_path/code-mutation-started"
          test ! -e "$marker"
          test ! -L "$marker"
          ( set -o noclobber; umask 077; printf '%s\n' "$run_id" > "$marker" )
          chmod 600 "$marker"
          test -f "$marker"
          test ! -L "$marker"
          test "$(file_mode "$marker")" = 600
          test "$(cat "$marker")" = "$run_id"
          REMOTE

          rsync -az --delete \
            -e "$ssh_transport" \
            .deploy/theme/ \
            "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/themes/kadence-child/"

          # ORDEM IMPORTA: os módulos vão ANTES do loader.
          # uonix-core.php requer uonix-shared/environment.php. Publicar o loader
          # primeiro abriria uma janela de segundos em que o core novo já está no
          # disco e a dependência ainda não — e mu-plugins carregam em toda
          # requisição. O loader tolera a ausência (is_readable + fallback), mas
          # publicar na ordem correta fecha a janela em vez de apenas sobreviver a
          # ela. Não inverta sem reler scripts/tests/test-mu-loader-resilience.sh.
          for module_name in "${expected_modules[@]}"; do
            rsync -az --delete \
              -e "$ssh_transport" \
              ".deploy/mu-plugins/$module_name/" \
              "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/mu-plugins/$module_name/"
          done

          rsync -az \
            -e "$ssh_transport" \
            .deploy/mu-plugins/uonix-core.php \
            "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/mu-plugins/uonix-core.php"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "${expected_modules[@]}" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          document_root="$1"
          shift

          if [ "$#" -eq 0 ]; then
            printf 'ERRO: allowlist vazia recebida no destino; nenhum módulo foi removido.\n' >&2
            exit 1
          fi
          for expected in "$@"; do
            case "$expected" in
              uonix-*[!A-Za-z0-9._-]*|uonix-|uonix-.|uonix-..|'')
                printf 'ERRO: nome de módulo inválido recebido no destino: %s\n' "$expected" >&2
                exit 1
                ;;
              uonix-*) ;;
              *)
                printf 'ERRO: nome de módulo inválido recebido no destino: %s\n' "$expected" >&2
                exit 1
                ;;
            esac
          done

          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            module_name="$(basename "$module")"
            keep=false
            for expected in "$@"; do
              if [ "$module_name" = "$expected" ]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = false ]; then
              rm -rf -- "$module"
            fi
          done
          REMOTE

          expected_manifest_checksum="$(sha256sum .deploy/manifest.sha256 | cut -d ' ' -f 1)"
          test "${#expected_manifest_checksum}" -eq 64
          case "$expected_manifest_checksum" in
            *[!0-9a-f]*) exit 1 ;;
          esac

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$BACKUP_DIR/manifest.expected.sha256" <<'REMOTE'
          set -euo pipefail
          manifest="$1"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          test ! -e "$manifest"
          test ! -L "$manifest"
          ( set -o noclobber; umask 077; : > "$manifest" )
          chmod 600 "$manifest"
          test -f "$manifest"
          test ! -L "$manifest"
          test ! -s "$manifest"
          test "$(file_mode "$manifest")" = 600
          REMOTE

          rsync -az --chmod=F600 \
            -e "$ssh_transport" \
            .deploy/manifest.sha256 \
            "$remote:$BACKUP_DIR/manifest.expected.sha256"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$BACKUP_DIR/manifest.expected.sha256" "$expected_manifest_checksum" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          manifest="$2"
          expected_manifest_checksum="$3"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          path_has_symlink() {
            local base="$1"
            local remaining="$2"
            local current="$base"
            local component
            [ ! -L "$current" ] || return 0
            while [ -n "$remaining" ]; do
              case "$remaining" in
                */*) component="${remaining%%/*}"; remaining="${remaining#*/}" ;;
                *) component="$remaining"; remaining='' ;;
              esac
              current="$current/$component"
              [ ! -L "$current" ] || return 0
            done
            return 1
          }

          test -f "$manifest"
          test ! -L "$manifest"
          test -s "$manifest"
          test "$(file_mode "$manifest")" = 600
          test "${#expected_manifest_checksum}" -eq 64
          case "$expected_manifest_checksum" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          actual_manifest_checksum="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          test "$actual_manifest_checksum" = "$expected_manifest_checksum"
          if ! tail -c 1 "$manifest" | grep -qx ''; then
            printf 'ERRO: manifesto esperado vazio ou sem newline final\n' >&2
            exit 1
          fi
          while read -r checksum relative_path; do
            case "$relative_path" in
              theme/*)
                managed_prefix='wp-content/themes/kadence-child'
                managed_relative="${relative_path#theme/}"
                ;;
              mu-plugins/*)
                managed_prefix='wp-content/mu-plugins'
                managed_relative="${relative_path#mu-plugins/}"
                ;;
              *)
                printf 'Path não gerenciado no manifest: %s\n' "$relative_path" >&2
                exit 1
                ;;
            esac
            case "/$managed_relative/" in
              *'/../'*|*'/./'*|*'//'*)
                printf 'Path inseguro no manifest: %s\n' "$relative_path" >&2
                exit 1
                ;;
            esac
            target="$document_root/$managed_prefix/$managed_relative"

            # Sem estas mensagens, uma divergência de manifest falha com exit 1 mudo
            # e não se sabe QUAL arquivo divergiu — só o caminho é impresso, nunca
            # conteúdo. Os hashes são de arquivos versionados, não segredos.
            if path_has_symlink "$document_root" "$managed_prefix/$managed_relative" || [ ! -f "$target" ]; then
              printf 'ERRO: arquivo do manifest ausente ou inseguro no destino: %s\n' "$relative_path" >&2
              exit 1
            fi
            actual="$(sha256sum "$target" | cut -d ' ' -f 1)"
            if [ "$actual" != "$checksum" ]; then
              printf 'ERRO: checksum divergente em %s (esperado %s, encontrado %s)\n' \
                "$relative_path" "$checksum" "$actual" >&2
              exit 1
            fi
          done < "$manifest"
          REMOTE

      - name: Clear cache and run smoke tests
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$TARGET_URL" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          target_url="$4"
          speedycache="$document_root/wp-content/cache/speedycache"

          if [ -d "$speedycache" ]; then
            find "$speedycache" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi

          # Rótulo antes de cada assertiva: sem isto o step só reporta "exit 1" e a
          # causa fica invisível no log, exigindo SSH para descobrir qual reprovou.
          # Nenhum valor de secret é impresso — apenas o nome da verificação.
          check() { printf 'smoke: %s\n' "$1"; }

          check 'wp cache flush'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" cache flush
          check 'wp core is-installed'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          check 'UONIX_ENV = production'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'echo defined("UONIX_ENV") ? UONIX_ENV : "";')" = production
          check 'option home = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get home)" = "$target_url"
          check 'option siteurl = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get siteurl)" = "$target_url"
          check 'política de indexação (UONIX_ALLOW_INDEXING, blog_public)'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
          if (
              ! defined( "UONIX_ALLOW_INDEXING" )
              || false !== UONIX_ALLOW_INDEXING
              || ! function_exists( "uonix_environment_allows_indexing" )
              || uonix_environment_allows_indexing()
              || "0" !== (string) get_option( "blog_public" )
          ) {
              exit( 1 );
          }
          '
          check 'coerência de uonix_analytics_configuration'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
          if ( ! function_exists( "uonix_analytics_configuration" ) ) {
              exit( 1 );
          }
          $configuration = uonix_analytics_configuration();
          if (
              false !== $configuration
              && (
                  ! is_array( $configuration )
                  || ! defined( "UONIX_ENV" )
                  || "production" !== UONIX_ENV
                  || ! defined( "UONIX_ANALYTICS_ENABLED" )
                  || true !== UONIX_ANALYTICS_ENABLED
              )
          ) {
              exit( 1 );
          }
          '
          REMOTE
          printf 'smoke: %s\n' 'X-Robots-Tag noindex/nofollow/noarchive'
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          effective_url="$(curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{url_effective}' "$TARGET_URL/")"
          [ "$effective_url" = "$TARGET_URL/" ]
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noindex'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*nofollow'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noarchive'

      - name: Migrate legacy variation technical sheets
        if: ${{ inputs.migrate_variation_technical_sheet }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
          LOCAWEB_SSH_PASSWORD_FILE: ${{ runner.temp }}/locaweb-ssh-password-migration
        run: |
          set -euo pipefail
          # Mantém o snapshot pré-publicação como baseline geral e cria um segundo
          # checkpoint imediatamente antes da mutação opcional. Se o fallback
          # integral for inevitável, a janela de escritas concorrentes é mínima.
          umask 077
          printf '%s' "$SSHPASS" > "$LOCAWEB_SSH_PASSWORD_FILE"
          chmod 600 "$LOCAWEB_SSH_PASSWORD_FILE"
          trap 'rm -f "$LOCAWEB_SSH_PASSWORD_FILE"' EXIT
          export LOCAWEB_SSH_KNOWN_HOSTS_FILE="$HOME/.ssh/locaweb_known_hosts"
          scripts/backup-remote-database.sh \
            --environment=production \
            --output-dir="$BACKUP_DIR" \
            --backup-id="zz-migration-${BACKUP_ID}" | tee "$RUNNER_TEMP/db-migration-backup.out"
          migration_backup_file="$(sed -n 's/^DB_BACKUP_FILE=//p' "$RUNNER_TEMP/db-migration-backup.out")"
          test -n "$migration_backup_file"
          printf 'DB_BACKUP_FILE=%s\n' "$migration_backup_file" >> "$GITHUB_ENV"
          printf 'Checkpoint de banco pré-migração: %s\n' "${migration_backup_file##*/}"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          run_id="$4"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          cli() {
            "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"
          }

          test -f "$document_root/wp-content/mu-plugins/uonix-woocommerce/22-ficha-tecnica-variacao.php"
          operation_lock="$document_root/.uonix-operation.lock"
          db_mutation_marker="$operation_lock/db-mutation-started"
          test -f "$operation_lock/owner"
          test ! -L "$operation_lock/owner"
          test "$(file_mode "$operation_lock/owner")" = 600
          test "$(cat "$operation_lock/owner")" = "$run_id"

          migration_lock="$document_root/.uonix-vts-migration.lock"
          legacy_count="$(cli eval '
            $ids = get_posts(array(
              "post_type" => "product_variation",
              "numberposts" => -1,
              "fields" => "ids",
              "meta_query" => array(array(
                "key" => "_variation_description",
                "value" => "uonix-fichas-compactas",
                "compare" => "LIKE",
              )),
            ));
            echo count($ids);
          ')"
          case "$legacy_count" in
            0)
              printf 'migração: nenhuma ficha legada; execute fará verificação idempotente\n'
              ;;
            5)
              printf 'migração: dry-run de cinco fichas legadas\n'
              cli uonix ficha-tecnica migrate --dry-run
              ;;
            *)
              printf 'migração recusada: esperadas zero ou cinco fichas legadas, encontradas %s\n' "$legacy_count" >&2
              exit 3
              ;;
          esac

          # O próprio processo PHP adquire o lock e cria o marcador, com owner,
          # depois do preflight interno e imediatamente antes do primeiro save().
          # Se o SSH morrer mas o PHP sobreviver, o lock continua existindo.
          migration_args=(
            --execute
            --mutation-marker="$db_mutation_marker"
            --mutation-owner="$run_id"
            --migration-lock="$migration_lock"
          )
          printf 'migração: execute protegido\n'
          cli uonix ficha-tecnica migrate "${migration_args[@]}"
          printf 'migração: verificação idempotente protegida\n'
          cli uonix ficha-tecnica migrate "${migration_args[@]}"
          REMOTE

      # Deve ser o último step potencialmente mutável antes do release. Assim,
      # falha ou cancelamento em qualquer etapa anterior ainda passa por rollback.
      - name: Roll back managed code after failure
        if: ${{ failure() || cancelled() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DIR:-}" ]; then
            echo 'Nenhum backup foi criado; não houve transferência para reverter.'
            exit 0
          fi
          backup_id="${BACKUP_DIR##*/}"
          operation_lock="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$BACKUP_DIR" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$TARGET_URL" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          document_root="$1"
          backup_dir="$2"
          php_bin="$3"
          wp_bin="$4"
          target_url="$5"
          run_id="$6"
          managed="$backup_dir/managed"
          operation_lock="$document_root/.uonix-operation.lock"
          code_mutation_marker="$operation_lock/code-mutation-started"
          db_mutation_marker="$operation_lock/db-mutation-started"
          migration_lock="$document_root/.uonix-vts-migration.lock"
          rollback_failed=0

          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }

          write_managed_manifest() {
            base="$1"
            output="$2"
            roots=("$base/themes/kadence-child" "$base/mu-plugins/uonix-core.php")
            for module in "$base"/mu-plugins/uonix-*; do
              [ -d "$module" ] && roots+=("$module")
            done

            path_list="$(mktemp "${output}.paths.XXXXXX")"
            sorted_list="$(mktemp "${output}.sorted.XXXXXX")"
            : > "$path_list"
            for root in "${roots[@]}"; do
              if [ -L "$root" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
              if [ -f "$root" ]; then
                printf '%s\n' "$root" >> "$path_list"
              elif [ -d "$root" ]; then
                nested_link="$(find "$root" -type l -print -quit)"
                if [ -n "$nested_link" ]; then
                  rm -f -- "$path_list" "$sorted_list"
                  return 1
                fi
                find "$root" -type f -print >> "$path_list"
              elif [ -e "$root" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
            done
            LC_ALL=C sort -u "$path_list" > "$sorted_list"
            if ! ( set -o noclobber; : > "$output" ); then
              rm -f -- "$path_list" "$sorted_list"
              return 1
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if [ -L "$file" ] || [ ! -f "$file" ]; then
                rm -f -- "$path_list" "$sorted_list"
                return 1
              fi
              relative="${file#"$base"/}"
              checksum="$(sha256sum "$file" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "$checksum" "$relative" >> "$output"
            done < "$sorted_list"
            rm -f -- "$path_list" "$sorted_list"
          }

          test -f "$operation_lock/owner"
          test ! -L "$operation_lock/owner"
          test "$(file_mode "$operation_lock/owner")" = 600
          test "$(cat "$operation_lock/owner")" = "$run_id"
          if [ ! -e "$code_mutation_marker" ] && [ ! -L "$code_mutation_marker" ] && [ ! -e "$db_mutation_marker" ] && [ ! -L "$db_mutation_marker" ]; then
            printf 'rollback: nenhuma mutação foi iniciada; nada a restaurar\n'
            exit 0
          fi

          for marker in "$code_mutation_marker" "$db_mutation_marker"; do
            if [ -e "$marker" ] || [ -L "$marker" ]; then
              test -f "$marker"
              test ! -L "$marker"
              test "$(file_mode "$marker")" = 600
            fi
          done

          # Cancelar o SSH não prova que o WP-CLI remoto terminou. Nunca restaure
          # banco ou código enquanto o lock da migração ainda estiver ativo.
          waited=0
          while [ -d "$migration_lock" ] && [ "$waited" -lt 20 ]; do
            sleep 1
            waited=$((waited + 1))
          done
          if [ -d "$migration_lock" ]; then
            migration_owner='desconhecido'
            if [ -f "$migration_lock/owner" ]; then
              migration_owner="$(cat "$migration_lock/owner")"
            fi
            printf 'rollback recusado: migração remota ainda ativa após %ss (owner=%s); lock preservado\n' \
              "$waited" "$migration_owner" >&2
            exit 1
          fi

          cli() {
            "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"
          }

          # O dump permanece disponível para análise/contingência MANUAL. O rollback
          # automático toca apenas as cinco fichas; nunca rebobina pedidos ou outras
          # escritas feitas depois do checkpoint.
          if [ -f "$db_mutation_marker" ]; then
            if [ "$(cat "$db_mutation_marker")" != "$run_id" ]; then
              printf 'rollback recusado: marcador de banco pertence a outra execução\n' >&2
              rollback_failed=1
            elif cli uonix ficha-tecnica migrate \
                --rollback \
                --mutation-marker="$db_mutation_marker" \
                --mutation-owner="$run_id" \
                --migration-lock="$migration_lock"; then
              if [ "$(cat "$db_mutation_marker")" = "$run_id" ]; then
                rm -f -- "$db_mutation_marker"
              else
                printf 'rollback seletivo terminou, mas o marcador mudou de owner\n' >&2
                rollback_failed=1
              fi
            else
              printf 'rollback seletivo falhou; dump integral NÃO será importado automaticamente\n' >&2
              rollback_failed=1
            fi
          else
            printf 'rollback: banco não foi marcado como mutado; restauração ignorada\n'
          fi

          # Não reinstale código antigo sobre banco migrado/parcial. Em falha do
          # rollback seletivo, preserve a versão nova, o lock e ambos os marcadores
          # para diagnóstico e intervenção sem perda de pedidos.
          if [ "$rollback_failed" -ne 0 ]; then
            printf 'rollback incompleto; código, lock e marcadores serão preservados para intervenção\n' >&2
            exit 1
          fi

          # O marcador de código também precisa pertencer a este run.
          if [ -f "$code_mutation_marker" ] && [ "$(cat "$code_mutation_marker")" != "$run_id" ]; then
            printf 'rollback recusado: marcador de código pertence a outra execução\n' >&2
            exit 1
          fi

          # Com o banco original confirmado (ou nunca tocado), restaure os arquivos.
          if [ -f "$code_mutation_marker" ]; then
            backup_manifest="$backup_dir/manifest.backup.sha256"
            test -f "$backup_manifest"
            test ! -L "$backup_manifest"
            test "$(file_mode "$backup_manifest")" = 600
            test -s "$backup_manifest"
            observed_manifest="$(mktemp)"
            rm -f -- "$observed_manifest"
            trap 'rm -f -- "$observed_manifest"' EXIT
            write_managed_manifest "$managed" "$observed_manifest"
            if ! cmp -s -- "$backup_manifest" "$observed_manifest"; then
              printf 'rollback recusado: manifesto/hash do backup de código diverge\n' >&2
              exit 1
            fi

            rm -rf -- "$document_root/wp-content/themes/kadence-child"
            rm -f -- "$document_root/wp-content/mu-plugins/uonix-core.php"
            for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
              [ -d "$module" ] && rm -rf -- "$module"
            done

            if [ -d "$managed/themes/kadence-child" ]; then
              cp -a "$managed/themes/kadence-child" "$document_root/wp-content/themes/"
            fi
            if [ -f "$managed/mu-plugins/uonix-core.php" ]; then
              cp -a "$managed/mu-plugins/uonix-core.php" "$document_root/wp-content/mu-plugins/"
            fi
            for module in "$managed"/mu-plugins/uonix-*; do
              [ -d "$module" ] || continue
              cp -a "$module" "$document_root/wp-content/mu-plugins/"
            done

            rm -f -- "$observed_manifest"
            write_managed_manifest "$document_root/wp-content" "$observed_manifest"
            if ! cmp -s -- "$backup_manifest" "$observed_manifest"; then
              printf 'rollback incompleto: código restaurado diverge do manifesto/hash do backup\n' >&2
              exit 1
            fi
          else
            printf 'rollback: código não foi marcado como mutado; restauração ignorada\n'
          fi

          if [ "$rollback_failed" -ne 0 ]; then
            printf 'rollback incompleto; lock e marcadores serão preservados para intervenção\n' >&2
            exit 1
          fi

          speedycache="$document_root/wp-content/cache/speedycache"
          if [ -d "$speedycache" ]; then
            find "$speedycache" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          # As assertivas abaixo espelham as do smoke. Um rollback que valide MENOS
          # pode declarar sucesso num estado que o smoke reprovaria — e o operador
          # confiaria num rollback incompleto.
          rollback_check() { printf 'rollback: %s\n' "$1"; }

          rollback_check 'wp cache flush'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" cache flush
          rollback_check 'wp core is-installed'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          rollback_check 'UONIX_ENV = production'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'echo defined("UONIX_ENV") ? UONIX_ENV : "";')" = production
          rollback_check 'option home = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get home)" = "$target_url"
          rollback_check 'option siteurl = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get siteurl)" = "$target_url"
          rollback_check 'política de indexação (UONIX_ALLOW_INDEXING, blog_public)'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'if (!defined("UONIX_ALLOW_INDEXING") || false !== UONIX_ALLOW_INDEXING || !function_exists("uonix_environment_allows_indexing") || uonix_environment_allows_indexing() || "0" !== (string) get_option("blog_public")) { exit(1); }'
          REMOTE
          printf 'rollback: %s\n' 'X-Robots-Tag noindex/nofollow/noarchive'
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          effective_url="$(curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{url_effective}' "$TARGET_URL/")"
          [ "$effective_url" = "$TARGET_URL/" ]
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noindex'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*nofollow'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noarchive'

          # O smoke externo também faz parte da prova. Só agora o marcador de código
          # pode ser removido; se esta conexão falhar, o lock permanece fechado.
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$operation_lock" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          lock_path="$1"
          run_id="$2"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          test -f "$lock_path/owner"
          test ! -L "$lock_path/owner"
          test "$(file_mode "$lock_path/owner")" = 600
          test "$(cat "$lock_path/owner")" = "$run_id"
          marker="$lock_path/code-mutation-started"
          test -f "$marker"
          test ! -L "$marker"
          test "$(file_mode "$marker")" = 600
          test "$(cat "$marker")" = "$run_id"
          rm -f -- "$marker"
          REMOTE
          echo "Rollback validado a partir do backup $backup_id."

      - name: Release exclusive production lock
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Sem lock adquirido não há nada a liberar: sair 0 evita um segundo step
          # vermelho quando o erro real está em outro lugar (ex.: preflight falhou).
          # Quando o lock EXISTE, a falha de liberação continua sendo reportada.
          if [ "${DEPLOY_LOCK_ACQUIRED:-false}" != true ]; then
            echo 'Lock de produção não foi adquirido nesta execução; nada a liberar.'
            exit 0
          fi
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$DEPLOY_RUN_ID" "$DEPLOY_LOCK_ACQUIRED" "${{ job.status }}" <<'REMOTE'
          set -euo pipefail
          lock_path="$1"
          run_id="$2"
          lock_acquired="$3"
          job_status="$4"
          file_mode() {
            if stat -c '%a' /dev/null >/dev/null 2>&1; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }
          if [ "$lock_acquired" = true ]; then
            test -f "$lock_path/owner"
            test ! -L "$lock_path/owner"
            test "$(file_mode "$lock_path/owner")" = 600
            test "$(cat "$lock_path/owner")" = "$run_id"
            for marker in code-mutation-started db-mutation-started; do
              if [ -e "$lock_path/$marker" ] || [ -L "$lock_path/$marker" ]; then
                test -f "$lock_path/$marker"
                test ! -L "$lock_path/$marker"
                test "$(file_mode "$lock_path/$marker")" = 600
                test "$(cat "$lock_path/$marker")" = "$run_id"
              fi
            done
            if [ "$job_status" = success ]; then
              rm -f -- "$lock_path/code-mutation-started" "$lock_path/db-mutation-started"
            fi
            # Em falha/cancelamento, somente um rollback integralmente validado
            # remove os marcadores. Preservá-los mantém o lock fail-closed.
            test ! -e "$lock_path/code-mutation-started"
            test ! -e "$lock_path/db-mutation-started"
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path"
          fi
          REMOTE

# Operational rule: if the three-hour SSH window is closed, preflight fails
# before backup or transfer. This workflow never falls back to FTP/SFTP.