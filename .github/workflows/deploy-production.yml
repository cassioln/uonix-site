name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite PUBLICAR <SHA> EM SITE.UONIX.COM.BR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uonix-environment-prod
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize canonical production request
    runs-on: ubuntu-latest
    env:
      UONIX_ENABLE_DEPLOY_PRODUCTION: ${{ vars.ENABLE_DEPLOY_PRODUCTION }}
      UONIX_PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
      UONIX_REQUEST_SHA: ${{ github.sha }}
      UONIX_REQUEST_REF: ${{ github.ref }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate production request and canonical target
        run: |
          set -euo pipefail
          [ "$UONIX_ENABLE_DEPLOY_PRODUCTION" = true ]
          [ "$UONIX_REQUEST_REF" = 'refs/heads/master' ]
          case "$UONIX_REQUEST_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
          [ "${#UONIX_REQUEST_SHA}" -eq 40 ]
          expected_confirmation="PUBLICAR ${UONIX_REQUEST_SHA} EM SITE.UONIX.COM.BR"
          [ "$UONIX_PRODUCTION_CONFIRMATION" = "$expected_confirmation" ]
          [ "$LOCAWEB_SSH_HOST" = 'ftp.site.uonix.com.br' ]
          [ "$LOCAWEB_SSH_PORT" = '22' ]
          [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
          [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
          [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
          [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
          [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
          [ "$TARGET_URL" = 'https://site.uonix.com.br' ]

  validate:
    name: Validate before production
    needs: authorize
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy managed code to Locaweb
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: production-locaweb
    env:
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_LOCK_ACQUIRED: 'false'

    steps:
      - name: Validate canonical production target before credentials
        run: |
          set -euo pipefail
          [ "$LOCAWEB_SSH_HOST" = 'ftp.site.uonix.com.br' ]
          [ "$LOCAWEB_SSH_PORT" = '22' ]
          [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
          [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
          [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
          [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
          [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
          [ "$TARGET_URL" = 'https://site.uonix.com.br' ]
          case "$DEPLOY_RUN_ID" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install SSH and rsync tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync sshpass

      - name: Pin known_hosts after canonical validation
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$LOCAWEB_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/locaweb_known_hosts"
          chmod 600 "$HOME/.ssh/locaweb_known_hosts"
          # Mesma razão do reusable do HostGator: o job contata o host várias
          # vezes em sequência e um firewall pode tratar a rajada como abuso,
          # recusando a porta no meio do deploy e deixando lock órfão. Aqui o
          # risco é maior, porque é produção. A multiplexação faz o host ver uma
          # única conexão. %C encurta o socket e evita estourar o limite do
          # caminho UNIX, que desligaria a multiplexação em silêncio.
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host $LOCAWEB_SSH_HOST
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 120
            ServerAliveInterval 30
            ServerAliveCountMax 4
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Preflight SSH window before any remote write
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            -o ConnectTimeout=15 \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          test -d "$document_root"
          command -v rsync >/dev/null
          command -v sha256sum >/dev/null
          test -x "$php_bin"
          test -f "$wp_bin"
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          REMOTE
          then
            echo 'SSH Locaweb indisponível ou WordPress ainda não preparado. Habilite a janela SSH por 3 horas; nenhum arquivo foi alterado.' >&2
            exit 1
          fi

      - name: Build deterministic deploy bundle
        run: scripts/prepare-deploy-bundle.sh --environment=production --output=.deploy

      - name: Acquire exclusive production lock
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$DEPLOY_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          lock_path="$1"
          run_id="$2"
          mkdir -- "$lock_path"
          if ! {
            printf '%s\n' "$run_id" > "$lock_path/owner"
            chmod 600 "$lock_path/owner"
          }; then
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path" 2>/dev/null || true
            exit 1
          fi
          REMOTE
          printf 'DEPLOY_LOCK_ACQUIRED=true\n' >> "$GITHUB_ENV"

      - name: Back up managed remote paths
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          backup_id="$DEPLOY_RUN_ID"
          backup_dir="$LOCAWEB_ACCOUNT_ROOT/_uonix-deploy-backups/$backup_id"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$backup_dir" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          document_root="$1"
          backup_dir="$2"
          managed="$backup_dir/managed"
          mkdir -p "$managed/themes" "$managed/mu-plugins"

          if [ -e "$document_root/wp-content/themes/kadence-child" ]; then
            cp -a "$document_root/wp-content/themes/kadence-child" "$managed/themes/"
          fi

          if [ -e "$document_root/wp-content/mu-plugins/uonix-core.php" ]; then
            cp -a "$document_root/wp-content/mu-plugins/uonix-core.php" "$managed/mu-plugins/"
          fi

          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            cp -a "$module" "$managed/mu-plugins/"
          done

          find "$managed" -type f -print | LC_ALL=C sort > "$backup_dir/files.txt"
          REMOTE

          printf 'BACKUP_ID=%s\n' "$backup_id" >> "$GITHUB_ENV"
          printf 'BACKUP_DIR=%s\n' "$backup_dir" >> "$GITHUB_ENV"
          printf 'Backup de código criado: %s\n' "$backup_id"

      # O passo acima salva apenas CÓDIGO. Sem o dump abaixo, um rollback
      # restauraria arquivos sobre um schema não restaurado — e a mutação de
      # banco mais provável aqui é o search-replace do cutover de domínio.
      #
      # Falha fechado de propósito: sem dump íntegro, nada é publicado.
      # Não usa `wp db export`: a Locaweb desabilita proc_open de forma
      # compilada, então o script escolhe mysqldump por capacidade do host.
      - name: Back up the production database
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
          LOCAWEB_SSH_PASSWORD_FILE: ${{ runner.temp }}/locaweb-ssh-password
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SSHPASS" > "$LOCAWEB_SSH_PASSWORD_FILE"
          chmod 600 "$LOCAWEB_SSH_PASSWORD_FILE"
          trap 'rm -f "$LOCAWEB_SSH_PASSWORD_FILE"' EXIT

          # $HOME precisa ser expandido pelo SHELL, não por ${{ }}: o contexto
          # `env` do Actions não conhece HOME e resolveria para string vazia,
          # gerando o caminho "/.ssh/locaweb_known_hosts" e abortando o backup
          # com "known_hosts Locaweb ausente ou vazio". Todas as outras etapas
          # deste workflow já usam "$HOME" — esta precisa seguir o mesmo padrão.
          export LOCAWEB_SSH_KNOWN_HOSTS_FILE="$HOME/.ssh/locaweb_known_hosts"

          scripts/backup-remote-database.sh \
            --environment=production \
            --output-dir="$BACKUP_DIR" \
            --backup-id="$BACKUP_ID" | tee "$RUNNER_TEMP/db-backup.out"

          db_backup_file="$(sed -n 's/^DB_BACKUP_FILE=//p' "$RUNNER_TEMP/db-backup.out")"
          test -n "$db_backup_file"
          printf 'DB_BACKUP_FILE=%s\n' "$db_backup_file" >> "$GITHUB_ENV"
          printf 'Backup de banco criado: %s\n' "${db_backup_file##*/}"

      - name: Publish only managed paths and verify manifest
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          remote="$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST"
          ssh_transport="sshpass -e ssh -p $LOCAWEB_SSH_PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/locaweb_known_hosts"

          rsync -az --delete \
            -e "$ssh_transport" \
            .deploy/theme/ \
            "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/themes/kadence-child/"

          # ORDEM IMPORTA: os módulos vão ANTES do loader.
          # uonix-core.php requer uonix-shared/environment.php. Publicar o loader
          # primeiro abriria uma janela de segundos em que o core novo já está no
          # disco e a dependência ainda não — e mu-plugins carregam em toda
          # requisição. O loader tolera a ausência (is_readable + fallback), mas
          # publicar na ordem correta fecha a janela em vez de apenas sobreviver a
          # ela. Não inverta sem reler scripts/tests/test-mu-loader-resilience.sh.
          expected_modules=()
          for module in .deploy/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            module_name="$(basename "$module")"
            expected_modules+=("$module_name")
            rsync -az --delete \
              -e "$ssh_transport" \
              "$module/" \
              "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/mu-plugins/$module_name/"
          done

          rsync -az \
            -e "$ssh_transport" \
            .deploy/mu-plugins/uonix-core.php \
            "$remote:$LOCAWEB_DOCUMENT_ROOT/wp-content/mu-plugins/uonix-core.php"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "${expected_modules[@]}" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          document_root="$1"
          shift

          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            module_name="$(basename "$module")"
            keep=false
            for expected in "$@"; do
              if [ "$module_name" = "$expected" ]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = false ]; then
              rm -rf -- "$module"
            fi
          done
          REMOTE

          rsync -az \
            -e "$ssh_transport" \
            .deploy/manifest.sha256 \
            "$remote:$BACKUP_DIR/manifest.expected.sha256"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$remote" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$BACKUP_DIR/manifest.expected.sha256" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          manifest="$2"

          while read -r checksum relative_path; do
            case "$relative_path" in
              theme/*)
                target="$document_root/wp-content/themes/kadence-child/${relative_path#theme/}"
                ;;
              mu-plugins/*)
                target="$document_root/wp-content/mu-plugins/${relative_path#mu-plugins/}"
                ;;
              *)
                printf 'Path não gerenciado no manifest: %s\n' "$relative_path" >&2
                exit 1
                ;;
            esac

            # Sem estas mensagens, uma divergência de manifest falha com exit 1 mudo
            # e não se sabe QUAL arquivo divergiu — só o caminho é impresso, nunca
            # conteúdo. Os hashes são de arquivos versionados, não segredos.
            if [ ! -f "$target" ]; then
              printf 'ERRO: arquivo do manifest não chegou ao destino: %s\n' "$relative_path" >&2
              exit 1
            fi
            actual="$(sha256sum "$target" | cut -d ' ' -f 1)"
            if [ "$actual" != "$checksum" ]; then
              printf 'ERRO: checksum divergente em %s (esperado %s, encontrado %s)\n' \
                "$relative_path" "$checksum" "$actual" >&2
              exit 1
            fi
          done < "$manifest"
          REMOTE

      - name: Clear cache and run smoke tests
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$TARGET_URL" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          target_url="$4"
          speedycache="$document_root/wp-content/cache/speedycache"

          if [ -d "$speedycache" ]; then
            find "$speedycache" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi

          # Rótulo antes de cada assertiva: sem isto o step só reporta "exit 1" e a
          # causa fica invisível no log, exigindo SSH para descobrir qual reprovou.
          # Nenhum valor de secret é impresso — apenas o nome da verificação.
          check() { printf 'smoke: %s\n' "$1"; }

          check 'wp cache flush'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" cache flush
          check 'wp core is-installed'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          check 'UONIX_ENV = production'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'echo defined("UONIX_ENV") ? UONIX_ENV : "";')" = production
          check 'option home = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get home)" = "$target_url"
          check 'option siteurl = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get siteurl)" = "$target_url"
          check 'política de indexação (UONIX_ALLOW_INDEXING, blog_public)'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
          if (
              ! defined( "UONIX_ALLOW_INDEXING" )
              || false !== UONIX_ALLOW_INDEXING
              || ! function_exists( "uonix_environment_allows_indexing" )
              || uonix_environment_allows_indexing()
              || "0" !== (string) get_option( "blog_public" )
          ) {
              exit( 1 );
          }
          '
          check 'coerência de uonix_analytics_configuration'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
          if ( ! function_exists( "uonix_analytics_configuration" ) ) {
              exit( 1 );
          }
          $configuration = uonix_analytics_configuration();
          if (
              false !== $configuration
              && (
                  ! is_array( $configuration )
                  || ! defined( "UONIX_ENV" )
                  || "production" !== UONIX_ENV
                  || ! defined( "UONIX_ANALYTICS_ENABLED" )
                  || true !== UONIX_ANALYTICS_ENABLED
              )
          ) {
              exit( 1 );
          }
          '
          REMOTE
          printf 'smoke: %s\n' 'X-Robots-Tag noindex/nofollow/noarchive'
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          effective_url="$(curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{url_effective}' "$TARGET_URL/")"
          [ "$effective_url" = "$TARGET_URL/" ]
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noindex'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*nofollow'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noarchive'

      - name: Roll back managed code after failure
        if: ${{ failure() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DIR:-}" ]; then
            echo 'Nenhum backup foi criado; não houve transferência para reverter.'
            exit 0
          fi
          backup_id="${BACKUP_DIR##*/}"

          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$BACKUP_DIR" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$TARGET_URL" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          document_root="$1"
          backup_dir="$2"
          php_bin="$3"
          wp_bin="$4"
          target_url="$5"
          managed="$backup_dir/managed"

          # O banco vem PRIMEIRO: restaurar arquivos sobre um schema divergente
          # produz um estado que passa no smoke de arquivos e mente sobre o
          # conteúdo. Se houver dump neste backup, ele é obrigatório — um dump
          # presente mas inválido aborta o rollback em vez de ser ignorado.
          db_dump="$(find "$backup_dir" -maxdepth 1 -name 'db-*.sql.gz' -print | LC_ALL=C sort | tail -1)"
          if [ -n "$db_dump" ]; then
            printf 'rollback: restaurando banco a partir de %s\n' "${db_dump##*/}"
            if ! gzip -t "$db_dump" 2>/dev/null; then
              printf 'dump de banco corrompido; rollback abortado antes de escrever\n' >&2
              exit 1
            fi
            if command -v mysql >/dev/null 2>&1; then
              credentials="$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval \
                'echo DB_NAME . "\t" . DB_USER . "\t" . DB_HOST;')"
              db_name="$(printf '%s' "$credentials" | cut -f1)"
              db_user="$(printf '%s' "$credentials" | cut -f2)"
              db_host="$(printf '%s' "$credentials" | cut -f3)"
              if ! MYSQL_PWD="$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'echo DB_PASSWORD;')" \
                  gzip -dc "$db_dump" | mysql --default-character-set=utf8mb4 \
                    -h "$db_host" -u "$db_user" "$db_name"; then
                printf 'restauração do banco falhou; rollback incompleto\n' >&2
                exit 1
              fi
            else
              printf 'cliente mysql ausente; não é possível restaurar o banco\n' >&2
              exit 1
            fi
          else
            printf 'rollback: nenhum dump de banco neste backup (somente código)\n'
          fi

          rm -rf -- "$document_root/wp-content/themes/kadence-child"
          rm -f -- "$document_root/wp-content/mu-plugins/uonix-core.php"
          for module in "$document_root"/wp-content/mu-plugins/uonix-*; do
            [ -d "$module" ] && rm -rf -- "$module"
          done

          if [ -d "$managed/themes/kadence-child" ]; then
            cp -a "$managed/themes/kadence-child" "$document_root/wp-content/themes/"
          fi
          if [ -f "$managed/mu-plugins/uonix-core.php" ]; then
            cp -a "$managed/mu-plugins/uonix-core.php" "$document_root/wp-content/mu-plugins/"
          fi
          for module in "$managed"/mu-plugins/uonix-*; do
            [ -d "$module" ] || continue
            cp -a "$module" "$document_root/wp-content/mu-plugins/"
          done

          speedycache="$document_root/wp-content/cache/speedycache"
          if [ -d "$speedycache" ]; then
            find "$speedycache" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          # As assertivas abaixo espelham as do smoke. Um rollback que valide MENOS
          # pode declarar sucesso num estado que o smoke reprovaria — e o operador
          # confiaria num rollback incompleto.
          rollback_check() { printf 'rollback: %s\n' "$1"; }

          rollback_check 'wp cache flush'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" cache flush
          rollback_check 'wp core is-installed'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          rollback_check 'UONIX_ENV = production'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'echo defined("UONIX_ENV") ? UONIX_ENV : "";')" = production
          rollback_check 'option home = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get home)" = "$target_url"
          rollback_check 'option siteurl = URL canônica'
          test "$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" option get siteurl)" = "$target_url"
          rollback_check 'política de indexação (UONIX_ALLOW_INDEXING, blog_public)'
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval 'if (!defined("UONIX_ALLOW_INDEXING") || false !== UONIX_ALLOW_INDEXING || !function_exists("uonix_environment_allows_indexing") || uonix_environment_allows_indexing() || "0" !== (string) get_option("blog_public")) { exit(1); }'
          REMOTE
          printf 'rollback: %s\n' 'X-Robots-Tag noindex/nofollow/noarchive'
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          effective_url="$(curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{url_effective}' "$TARGET_URL/")"
          [ "$effective_url" = "$TARGET_URL/" ]
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noindex'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*nofollow'
          tr -d '\r' < "$headers" | grep -Eiq '^X-Robots-Tag:.*noarchive'
          echo "Rollback validado a partir do backup $backup_id."

      - name: Retain thirty code and database backups
        if: ${{ success() }}
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Trinta, não cinco: medido no host, cada dump comprimido ocupa ~1,3 MB,
          # então 30 backups somam ~39 MB — irrelevante frente aos 738 GB livres.
          # Reter só cinco descartaria histórico útil sem economizar nada.
          # O dump mora dentro do diretório do backup, então esta poda já o cobre.
          # Variables in this command expand on the remote host.
          # shellcheck disable=SC2016
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            'backup_root=/home/storage/f/34/12/siteuonix1/_uonix-deploy-backups; if [ -d "$backup_root" ]; then find "$backup_root" -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort -r | tail -n +31 | while IFS= read -r old_backup; do rm -rf -- "$old_backup"; done; fi'

      - name: Release exclusive production lock
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Sem lock adquirido não há nada a liberar: sair 0 evita um segundo step
          # vermelho quando o erro real está em outro lugar (ex.: preflight falhou).
          # Quando o lock EXISTE, a falha de liberação continua sendo reportada.
          if [ "${DEPLOY_LOCK_ACQUIRED:-false}" != true ]; then
            echo 'Lock de produção não foi adquirido nesta execução; nada a liberar.'
            exit 0
          fi
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$DEPLOY_RUN_ID" "$DEPLOY_LOCK_ACQUIRED" <<'REMOTE'
          set -euo pipefail
          lock_path="$1"
          run_id="$2"
          lock_acquired="$3"
          if [ "$lock_acquired" = true ]; then
            test -f "$lock_path/owner"
            test "$(cat "$lock_path/owner")" = "$run_id"
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path"
          fi
          REMOTE

# Operational rule: if the three-hour SSH window is closed, preflight fails
# before backup or transfer. This workflow never falls back to FTP/SFTP.