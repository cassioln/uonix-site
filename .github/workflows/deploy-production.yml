name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Kadence Child to production
    runs-on: ubuntu-latest

    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate variables and secrets
        run: |
          test -n "$PRODUCTION_SSH_HOST" || (echo "Missing variable PRODUCTION_SSH_HOST" && exit 1)
          test -n "$PRODUCTION_SSH_USER" || (echo "Missing variable PRODUCTION_SSH_USER" && exit 1)
          test -n "$PRODUCTION_PATH" || (echo "Missing variable PRODUCTION_PATH" && exit 1)
          test -n "${{ secrets.STAGING_SSH_KEY }}" || (echo "Missing secret STAGING_SSH_KEY" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p 22 -H "$PRODUCTION_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p 22 -i ~/.ssh/production_key \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "echo SSH connection OK"

      - name: Deploy theme to production
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='._*' \
            -e "ssh -p 22 -i ~/.ssh/production_key" \
            themes/kadence-child/ \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$PRODUCTION_PATH/"

      - name: Deploy MU plugins to production
        run: |
          PRODUCTION_MU_PLUGINS_PATH="$(dirname "$(dirname "$PRODUCTION_PATH")")/mu-plugins"

          ssh -p 22 -i ~/.ssh/production_key \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "mkdir -p '$PRODUCTION_MU_PLUGINS_PATH'"

          rsync -avz \
            --exclude='.DS_Store' \
            --exclude='._*' \
            --exclude='uonix-local/***' \
            --include='uonix-core.php' \
            --include='uonix-*/' \
            --include='uonix-*/**' \
            --exclude='*' \
            -e "ssh -p 22 -i ~/.ssh/production_key" \
            mu-plugins/ \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$PRODUCTION_MU_PLUGINS_PATH/"

      - name: Clear production page cache
        run: |
          ssh -p 22 -i ~/.ssh/production_key \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "set -e;
             theme_path='$PRODUCTION_PATH';
             wp_content_dir=\$(dirname \"\$(dirname \"\$theme_path\")\");
             wp_root_dir=\$(dirname \"\$wp_content_dir\");
             speedycache_dir=\"\$wp_content_dir/cache/speedycache\";

             if [ -d \"\$speedycache_dir\" ]; then
               find \"\$speedycache_dir\" -mindepth 1 -maxdepth 1 -exec rm -rf {} +;
               echo \"SpeedyCache cleared: \$speedycache_dir\";
             else
               echo \"SpeedyCache directory not found: \$speedycache_dir\";
             fi;

             if command -v wp >/dev/null 2>&1; then
               wp --path=\"\$wp_root_dir\" cache flush || true;
             fi"
