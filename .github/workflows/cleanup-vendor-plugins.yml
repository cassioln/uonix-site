name: Cleanup Vendor Plugins

# Remove os plugins empacotados pela Softaculous (e o loginizer) do ambiente
# escolhido, com backup obrigatório antes de qualquer escrita.
#
# Por que um workflow e não SSH manual: a senha da Locaweb existe somente como
# secret. Aqui a operação fica auditável, o backup de banco é pré-requisito
# fail-closed e a senha nunca transita por sessão interativa.
#
# O loginizer sai por decisão registrada de Cassio (2026-08-05): o Turnstile no
# wp-login.php passa a ser a única proteção de login. O bloco `# BEGIN Loginizer`
# do .htaccess NÃO é tocado — ele contém o rewrite da URL de admin `/painel`,
# medido vivo nos três ambientes. Removê-lo derrubaria o acesso ao painel.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        type: choice
        options:
          - prod
          - qa
          - dev
      mode:
        description: Validar (dry-run) ou executar a remoção
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute
      confirmation:
        description: Para executar em prod, digite LIMPAR PLUGINS EM PROD @ <SHA>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: uonix-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize request before credentials
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.request.outputs.environment_name }}
    env:
      UONIX_REQUEST_ENVIRONMENT: ${{ inputs.environment }}
      UONIX_REQUEST_MODE: ${{ inputs.mode }}
      UONIX_REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
      UONIX_REQUEST_SHA: ${{ github.sha }}
      UONIX_REQUEST_REF: ${{ github.ref }}
      UONIX_ENABLE_CLEANUP_PRODUCTION: ${{ vars.ENABLE_CLEANUP_PRODUCTION }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate request and canonical target
        id: request
        run: |
          set -euo pipefail
          [ "$UONIX_REQUEST_REF" = 'refs/heads/master' ]
          case "$UONIX_REQUEST_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
          [ "${#UONIX_REQUEST_SHA}" -eq 40 ]
          case "$UONIX_REQUEST_ENVIRONMENT" in prod|qa|dev) ;; *) exit 1 ;; esac
          case "$UONIX_REQUEST_MODE" in dry-run|execute) ;; *) exit 1 ;; esac

          environment_name='clone-operations'
          if [ "$UONIX_REQUEST_MODE" = execute ] && [ "$UONIX_REQUEST_ENVIRONMENT" = prod ]; then
            # Produção exige guard ligado E frase com o SHA: o guard sozinho não
            # protege contra disparo acidental, e a frase sozinha não protege
            # contra o workflow ficar armado indefinidamente.
            [ "$UONIX_ENABLE_CLEANUP_PRODUCTION" = true ]
            expected="LIMPAR PLUGINS EM PROD @ ${UONIX_REQUEST_SHA}"
            [ "$UONIX_REQUEST_CONFIRMATION" = "$expected" ]
            environment_name='production-locaweb'
          else
            [ -z "$UONIX_REQUEST_CONFIRMATION" ]
          fi

          if [ "$UONIX_REQUEST_ENVIRONMENT" = prod ]; then
            [ "$LOCAWEB_SSH_HOST" = 'ftp.site.uonix.com.br' ]
            [ "$LOCAWEB_SSH_PORT" = '22' ]
            [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
            [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
            [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
            [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
            [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
            [ "$PRODUCTION_URL" = 'https://site.uonix.com.br' ]
          fi

          printf 'environment_name=%s\n' "$environment_name" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate before cleanup
    needs: authorize
    uses: ./.github/workflows/validate.yml

  cleanup:
    name: Cleanup vendor plugins on ${{ inputs.environment }} (${{ inputs.mode }})
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: ${{ needs.authorize.outputs.environment_name }}
    env:
      UONIX_REQUEST_ENVIRONMENT: ${{ inputs.environment }}
      UONIX_REQUEST_MODE: ${{ inputs.mode }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
      CLEANUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLEANUP_LOCK_ACQUIRED: 'false'

    steps:
      - name: Reject non-production environments in this workflow
        run: |
          set -euo pipefail
          # QA e DEV já foram limpos por acesso direto e ficam fora daqui de
          # propósito: este workflow existe para o host cuja senha só vive no
          # secret. Aceitar os outros duplicaria caminho sem ganho.
          [ "$UONIX_REQUEST_ENVIRONMENT" = prod ] || {
            echo 'Este workflow cobre apenas prod (Locaweb). QA/DEV já foram limpos.' >&2
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install SSH tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Pin known_hosts after canonical validation
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$LOCAWEB_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/locaweb_known_hosts"
          chmod 600 "$HOME/.ssh/locaweb_known_hosts"
          # Multiplexação: este job contata o host várias vezes em sequência e a
          # Locaweb/HostGator tratam a rajada como abuso, recusando a porta no
          # meio da operação. Medido: uma remoção em lote por conexões separadas
          # falhou no meio; com ControlMaster e um laço remoto único, não falhou.
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host $LOCAWEB_SSH_HOST
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 120
            ServerAliveInterval 30
            ServerAliveCountMax 4
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Preflight SSH window before any remote write
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            -o ConnectTimeout=15 \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          test -d "$document_root"
          test -x "$php_bin"
          test -f "$wp_bin"
          # O produtor do dump é pré-requisito: exigir só o cliente deixaria a
          # falta do mysqldump aparecer depois do backup já ter começado.
          command -v mysqldump >/dev/null || command -v mariadb-dump >/dev/null
          command -v gzip >/dev/null
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          REMOTE
          then
            echo 'SSH Locaweb indisponível ou WordPress não preparado. Habilite a janela SSH; nada foi alterado.' >&2
            exit 1
          fi

      - name: Report the real inventory before deciding
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # A lista do card é hipótese. Ambientes divergem (DEV tinha 12, QA 13)
          # e um plugin pode já estar ausente. O inventário real manda.
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE' | tee inventory.txt
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }
          echo '--- alvos presentes ---'
          wp plugin list --format=csv --fields=name,status \
            | grep -Ei '^(backuply|backuply-pro|fileorganizer|fileorganizer-pro|socialfeeds|socialfeeds-pro|softaculous-pro|cookieadmin|cookieadmin-pro|formlayer-pro|siteseo|siteseo-pro|speedycache|speedycache-pro|loginizer|loginizer-security),' \
            || echo 'NENHUM_ALVO_PRESENTE'
          echo '--- total de plugins ---'
          wp plugin list --format=csv --fields=name | tail -n +2 | wc -l
          echo '--- Turnstile precisa estar ativo antes de remover o loginizer ---'
          wp eval 'echo (defined("UONIX_TURNSTILE_ENABLED") && UONIX_TURNSTILE_ENABLED) ? "TURNSTILE_ATIVO" : "TURNSTILE_INDEFINIDO";' || true
          REMOTE

      - name: Acquire exclusive lock
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$CLEANUP_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          lock_path="$1"; run_id="$2"
          mkdir -- "$lock_path"
          if ! {
            printf '%s\n' "$run_id" > "$lock_path/owner"
            chmod 600 "$lock_path/owner"
          }; then
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path" 2>/dev/null || true
            exit 1
          fi
          REMOTE
          printf 'CLEANUP_LOCK_ACQUIRED=true\n' >> "$GITHUB_ENV"

      - name: Back up .htaccess and the database before any write
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          backup_dir="$LOCAWEB_ACCOUNT_ROOT/_uonix-cleanup-backups/$CLEANUP_RUN_ID"
          printf 'BACKUP_DIR=%s\n' "$backup_dir" >> "$GITHUB_ENV"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$backup_dir" <<'REMOTE'
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"; backup_dir="$4"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }
          umask 077
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"

          cp -p "$document_root/.htaccess" "$backup_dir/htaccess.bak"
          test -s "$backup_dir/htaccess.bak"

          # `wp db export` NÃO funciona aqui: a Locaweb desabilita proc_open de
          # forma compilada. mysqldump direto é o único caminho confiável.
          dump="$backup_dir/db.sql.gz"
          set -o pipefail
          MYSQL_PWD="$(wp config get DB_PASSWORD)" mysqldump \
            --host="$(wp config get DB_HOST)" \
            --user="$(wp config get DB_USER)" \
            --single-transaction --quick --skip-lock-tables \
            --default-character-set=utf8mb4 \
            "$(wp config get DB_NAME)" | gzip -c > "$dump"

          # gzip -t valida o ENVELOPE, não o conteúdo: um mysqldump interrompido
          # produz gzip íntegro. Exigir o marcador final como última linha não
          # vazia é o que prova dump completo. Filtra vazias antes do tail e
          # normaliza CRLF — janela fixa reprovaria dump legítimo.
          test -s "$dump"
          gzip -t "$dump"
          last="$(gzip -dc "$dump" | tr -d '\r' | grep -v '^[[:space:]]*$' | tail -n 1)"
          case "$last" in
            '-- Dump completed'|'-- Dump completed on '*) echo 'BACKUP_VALIDO' ;;
            *) echo 'BACKUP_INVALIDO: dump sem marcador final' >&2; exit 1 ;;
          esac
          chmod 600 "$dump" "$backup_dir/htaccess.bak"
          ls -la "$backup_dir"
          REMOTE

      - name: Prove zero content usage before deleting
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          # wp eval, não wp db query: proc_open desabilitado faz db query falhar.
          # O PHP vai literal de propósito: $wpdb e as aspas escapadas são do PHP,
          # não expansão de shell.
          # shellcheck disable=SC2016
          used="$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
            global $wpdb;
            echo (int) $wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->posts}
              WHERE post_status=\"publish\" AND (
                post_content LIKE \"%socialfeed%\" OR
                post_content LIKE \"%sfeed%\" OR
                post_content LIKE \"%social-feed%\"
              )");')"
          printf 'posts_publicados_usando_alvos=%s\n' "$used"
          [ "$used" = 0 ] || {
            echo 'Há conteúdo publicado usando os plugins alvo; abortando sem remover.' >&2
            exit 1
          }
          REMOTE

      - name: Remove vendor plugins in a single remote session
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -uo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }

          # UM laço numa única sessão SSH: remover como N invocações separadas fez
          # o host recusar a porta no meio, deixando o lote pela metade.
          # `-pro` antes do base. Desativar antes de apagar — a desativação é o
          # que limpa os blocos do plugin no .htaccess.
          failures=0
          for p in backuply-pro backuply \
                   fileorganizer-pro fileorganizer \
                   socialfeeds-pro socialfeeds \
                   softaculous-pro \
                   loginizer loginizer-security \
                   cookieadmin-pro cookieadmin \
                   formlayer-pro \
                   siteseo-pro siteseo \
                   speedycache-pro speedycache; do
            if ! wp plugin is-installed "$p" >/dev/null 2>&1; then
              echo "AUSENTE  $p"
              continue
            fi
            wp plugin deactivate "$p" >/dev/null 2>&1 || true
            if wp plugin delete "$p" >/dev/null 2>&1; then
              echo "REMOVIDO $p"
            else
              echo "FALHA    $p"
              failures=$((failures + 1))
            fi
          done

          echo '--- alvos restantes ---'
          wp plugin list --format=csv --fields=name,status \
            | grep -Ei '^(backuply|fileorganizer|socialfeeds|softaculous|cookieadmin|formlayer|siteseo|speedycache|loginizer)' \
            || echo 'NENHUM_ALVO_RESTANTE'
          echo '--- total de plugins ---'
          wp plugin list --format=csv --fields=name | tail -n +2 | wc -l

          [ "$failures" -eq 0 ]
          REMOTE

      - name: Validate the site after removal
        if: ${{ inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          # Amostragem repetida: um único 200 não distingue site saudável de
          # falha intermitente pós-remoção.
          probe() {
            local label="$1" path="$2" expected="$3" attempt=1 code
            while :; do
              code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 \
                -A 'uonix-cleanup-smoke/1.0' "${TARGET_URL}${path}")"
              if [ "$code" = "$expected" ]; then
                printf '  %-12s %s OK\n' "$label" "$code"
                return 0
              fi
              # Mod_Security responde 403/406/409 a tráfego automatizado em
              # caminhos de login e libera em ~180s; não é queda do site.
              case "$code" in
                403|406|408|409|429|5??)
                  if [ "$attempt" -ge 5 ]; then
                    echo "  $label respondeu $code em 5 tentativas" >&2
                    return 1
                  fi
                  sleep $((attempt * 15))
                  attempt=$((attempt + 1))
                  ;;
                *) echo "  $label respondeu $code (esperado $expected)" >&2; return 1 ;;
              esac
            done
          }
          probe home '/' '200'
          probe produtos '/produtos/' '200'
          probe login '/wp-login.php' '200'
          probe painel '/painel' '200'
          probe rest '/wp-json/' '200'

          echo 'Enumeração de usuários deve seguir bloqueada:'
          users="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$TARGET_URL/wp-json/wp/v2/users")"
          [ "$users" = 404 ] || { echo "  REST users respondeu $users; esperado 404" >&2; exit 1; }
          echo '  users 404 OK'

          echo 'Turnstile deve continuar no login e os plugins removidos não podem aparecer:'
          login_html="$(curl -sSL --max-time 30 "$TARGET_URL/wp-login.php")"
          printf '%s' "$login_html" | grep -qi turnstile || {
            echo '  Turnstile ausente do wp-login.php' >&2; exit 1; }
          echo '  turnstile presente OK'
          home_html="$(curl -sSL --max-time 30 "$TARGET_URL/")"
          for name in socialfeeds backuply fileorganizer siteseo cookieadmin softaculous loginizer; do
            if printf '%s' "$home_html" | grep -qi "$name"; then
              echo "  resíduo de $name no HTML" >&2
              exit 1
            fi
          done
          echo '  zero resíduo OK'

      - name: Release exclusive lock
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${CLEANUP_LOCK_ACQUIRED:-false}" != true ]; then
            echo 'Lock não foi adquirido nesta execução; nada a liberar.'
            exit 0
          fi
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$CLEANUP_RUN_ID" <<'REMOTE'
          set -euo pipefail
          lock_path="$1"; run_id="$2"
          test -f "$lock_path/owner"
          test "$(cat "$lock_path/owner")" = "$run_id"
          rm -f -- "$lock_path/owner"
          rmdir -- "$lock_path"
          REMOTE

      - name: Publish sanitized summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # Os backticks são markdown para o summary do run, não substituição de
          # comando: as aspas simples são deliberadas.
          # shellcheck disable=SC2016
          {
            printf '## Limpeza de plugins de fornecedor\n\n'
            printf -- '- Ambiente: `%s`\n' "$UONIX_REQUEST_ENVIRONMENT"
            printf -- '- Modo: `%s`\n' "$UONIX_REQUEST_MODE"
            printf -- '- Backup: `%s`\n' "${BACKUP_DIR:-nenhum (dry-run ou aborto antes da escrita)}"
            if [ -s inventory.txt ]; then
              printf -- '- Inventário coletado antes da decisão:\n\n```\n'
              cat inventory.txt
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
