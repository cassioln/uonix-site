name: Cleanup Vendor Plugins

# Remove os plugins empacotados pela Softaculous (e o loginizer) do ambiente
# escolhido, com backup obrigatório antes de qualquer escrita.
#
# Por que um workflow e não SSH manual: a senha da Locaweb existe somente como
# secret. Aqui a operação fica auditável, o backup de banco é pré-requisito
# fail-closed e a senha nunca transita por sessão interativa.
#
# O loginizer sai por decisão registrada de Cassio (2026-08-05): o Turnstile no
# wp-login.php passa a ser a única proteção de login. O bloco `# BEGIN Loginizer`
# do .htaccess contém o rewrite da URL de admin `/painel`: as DIRETIVAS nunca são
# tocadas. Depois da remoção, somente os dois comentários enganosos são renomeados
# para `UonixAdminPath`, com prova byte a byte antes de substituir o arquivo.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        type: choice
        options:
          - prod
          - qa
          - dev
      mode:
        description: Validar (dry-run) ou executar a remoção
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute
      confirmation:
        description: Para executar em prod, digite LIMPAR PLUGINS EM PROD @ <SHA>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: uonix-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize request before credentials
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.request.outputs.environment_name }}
    env:
      UONIX_REQUEST_ENVIRONMENT: ${{ inputs.environment }}
      UONIX_REQUEST_MODE: ${{ inputs.mode }}
      UONIX_REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
      UONIX_REQUEST_SHA: ${{ github.sha }}
      UONIX_REQUEST_REF: ${{ github.ref }}
      UONIX_ENABLE_CLEANUP_PRODUCTION: ${{ vars.ENABLE_CLEANUP_PRODUCTION }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate request and canonical target
        id: request
        run: |
          set -euo pipefail
          [ "$UONIX_REQUEST_REF" = 'refs/heads/master' ]
          case "$UONIX_REQUEST_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
          [ "${#UONIX_REQUEST_SHA}" -eq 40 ]
          case "$UONIX_REQUEST_ENVIRONMENT" in prod|qa|dev) ;; *) exit 1 ;; esac
          case "$UONIX_REQUEST_MODE" in dry-run|execute) ;; *) exit 1 ;; esac

          environment_name='clone-operations'
          if [ "$UONIX_REQUEST_ENVIRONMENT" = prod ]; then
            # QUALQUER toque em produção — inclusive dry-run, que só lê — passa
            # pelo environment com gate de aprovação. Deixar o dry-run fora seria
            # o único caminho capaz de abrir SSH em produção sem revisor.
            environment_name='production-locaweb'
          fi
          if [ "$UONIX_REQUEST_MODE" = execute ] && [ "$UONIX_REQUEST_ENVIRONMENT" = prod ]; then
            # Produção exige guard ligado E frase com o SHA: o guard sozinho não
            # protege contra disparo acidental, e a frase sozinha não protege
            # contra o workflow ficar armado indefinidamente.
            [ "$UONIX_ENABLE_CLEANUP_PRODUCTION" = true ]
            expected="LIMPAR PLUGINS EM PROD @ ${UONIX_REQUEST_SHA}"
            [ "$UONIX_REQUEST_CONFIRMATION" = "$expected" ]
          else
            [ -z "$UONIX_REQUEST_CONFIRMATION" ]
          fi

          if [ "$UONIX_REQUEST_ENVIRONMENT" = prod ]; then
            [ "$LOCAWEB_SSH_HOST" = 'ftp.site.uonix.com.br' ]
            [ "$LOCAWEB_SSH_PORT" = '22' ]
            [ "$LOCAWEB_SSH_USER" = 'siteuonix1' ]
            [ "$LOCAWEB_DOCUMENT_ROOT" = '/home/storage/f/34/12/siteuonix1/public_html' ]
            [ "$LOCAWEB_ACCOUNT_ROOT" = '/home/storage/f/34/12/siteuonix1' ]
            [ "$LOCAWEB_PHP_BIN" = '/usr/bin/php85' ]
            [ "$LOCAWEB_WP_BIN" = '/home/storage/f/34/12/siteuonix1/bin/wp-cli.phar' ]
            [ "$PRODUCTION_URL" = 'https://site.uonix.com.br' ]
          fi

          printf 'environment_name=%s\n' "$environment_name" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate before cleanup
    needs: authorize
    uses: ./.github/workflows/validate.yml

  cleanup:
    name: Cleanup vendor plugins on ${{ inputs.environment }} (${{ inputs.mode }})
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: ${{ needs.authorize.outputs.environment_name }}
    env:
      UONIX_REQUEST_ENVIRONMENT: ${{ inputs.environment }}
      UONIX_REQUEST_MODE: ${{ inputs.mode }}
      LOCAWEB_SSH_HOST: ${{ vars.LOCAWEB_SSH_HOST }}
      LOCAWEB_SSH_PORT: ${{ vars.LOCAWEB_SSH_PORT }}
      LOCAWEB_SSH_USER: ${{ vars.LOCAWEB_SSH_USER }}
      LOCAWEB_DOCUMENT_ROOT: ${{ vars.LOCAWEB_DOCUMENT_ROOT }}
      LOCAWEB_ACCOUNT_ROOT: ${{ vars.LOCAWEB_ACCOUNT_ROOT }}
      LOCAWEB_PHP_BIN: ${{ vars.LOCAWEB_PHP_BIN }}
      LOCAWEB_WP_BIN: ${{ vars.LOCAWEB_WP_BIN }}
      TARGET_URL: ${{ vars.PRODUCTION_URL }}
      CLEANUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLEANUP_LOCK_ACQUIRED: 'false'

    steps:
      - name: Reject non-production environments in this workflow
        run: |
          set -euo pipefail
          # QA e DEV já foram limpos por acesso direto e ficam fora daqui de
          # propósito: este workflow existe para o host cuja senha só vive no
          # secret. Aceitar os outros duplicaria caminho sem ganho.
          [ "$UONIX_REQUEST_ENVIRONMENT" = prod ] || {
            echo 'Este workflow cobre apenas prod (Locaweb). QA/DEV já foram limpos.' >&2
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install SSH tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Pin known_hosts after canonical validation
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$LOCAWEB_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/locaweb_known_hosts"
          chmod 600 "$HOME/.ssh/locaweb_known_hosts"
          # Multiplexação: este job contata o host várias vezes em sequência e a
          # Locaweb/HostGator tratam a rajada como abuso, recusando a porta no
          # meio da operação. Medido: uma remoção em lote por conexões separadas
          # falhou no meio; com ControlMaster e um laço remoto único, não falhou.
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host $LOCAWEB_SSH_HOST
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 120
            ServerAliveInterval 30
            ServerAliveCountMax 4
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Preflight SSH window before any remote write
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            -o ConnectTimeout=15 \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"
          php_bin="$2"
          wp_bin="$3"
          test -d "$document_root"
          test -x "$php_bin"
          test -f "$wp_bin"
          # O produtor do dump é pré-requisito: exigir só o cliente deixaria a
          # falta do mysqldump aparecer depois do backup já ter começado.
          command -v mysqldump >/dev/null || command -v mariadb-dump >/dev/null
          command -v gzip >/dev/null
          "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" core is-installed
          REMOTE
          then
            echo 'SSH Locaweb indisponível ou WordPress não preparado. Habilite a janela SSH; nada foi alterado.' >&2
            exit 1
          fi

      - name: Report the real inventory before deciding
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # A lista do card é hipótese. Ambientes divergem (DEV tinha 12, QA 13)
          # e um plugin pode já estar ausente. O inventário real manda.
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE' | tee inventory.txt
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }
          echo '--- alvos presentes ---'
          wp plugin list --format=csv --fields=name,status \
            | grep -Ei '^(backuply|backuply-pro|fileorganizer|fileorganizer-pro|socialfeeds|socialfeeds-pro|softaculous-pro|cookieadmin|cookieadmin-pro|formlayer-pro|siteseo|siteseo-pro|speedycache|speedycache-pro|loginizer|loginizer-security),' \
            || echo 'NENHUM_ALVO_PRESENTE'
          echo '--- total de plugins ---'
          wp plugin list --format=csv --fields=name | tail -n +2 | wc -l
          echo '--- Turnstile precisa estar ATIVO antes de remover o loginizer ---'
          # Contrato real do módulo: uonix_login_turnstile_is_active() em
          # mu-plugins/uonix-admin/51-login-turnstile.php exige as três funções do
          # uonix-integrations E uonix_turnstile_is_enabled(). Checar uma constante
          # UONIX_TURNSTILE_ENABLED seria inventar API: ela não existe no repo.
          wp eval '
            $active = function_exists("uonix_login_turnstile_is_active")
              ? uonix_login_turnstile_is_active() : false;
            echo $active ? "TURNSTILE_ATIVO" : "TURNSTILE_INATIVO";
            echo "\n";
            echo "site_key_definida=" . (defined("UONIX_TURNSTILE_SITE_KEY") && UONIX_TURNSTILE_SITE_KEY ? "sim" : "nao") . "\n";
            echo "secret_key_definida=" . (defined("UONIX_TURNSTILE_SECRET_KEY") && UONIX_TURNSTILE_SECRET_KEY ? "sim" : "nao") . "\n";' || true
          echo '--- loginizer ainda instalado? ---'
          wp plugin is-installed loginizer >/dev/null 2>&1 \
            && echo 'LOGINIZER_PRESENTE' || echo 'LOGINIZER_AUSENTE'
          REMOTE

      - name: Acquire exclusive lock
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          # O remoto IMPRIME um marcador quando o lock fica de fato criado. Sem
          # isso havia assimetria: se o mkdir+owner completassem no host mas o
          # ssh retornasse ≠0 (queda de rede no fechamento), o runner marcaria
          # CLEANUP_LOCK_ACQUIRED=false, o release sairia limpo e o diretório
          # ficaria órfão — travando a próxima execução sem explicação.
          out="$(sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$CLEANUP_RUN_ID" <<'REMOTE' || true
          set -euo pipefail
          umask 077
          lock_path="$1"; run_id="$2"
          mkdir -- "$lock_path"
          if ! {
            printf '%s\n' "$run_id" > "$lock_path/owner"
            chmod 600 "$lock_path/owner"
          }; then
            rm -f -- "$lock_path/owner"
            rmdir -- "$lock_path" 2>/dev/null || true
            exit 1
          fi
          printf 'UONIX_LOCK_ACQUIRED\n'
          REMOTE
          )"
          printf '%s\n' "$out"
          # Marca como adquirido se o HOST confirmou, independente do status do
          # transporte. Assim o release sempre tenta limpar o que existe.
          if printf '%s\n' "$out" | grep -q 'UONIX_LOCK_ACQUIRED'; then
            printf 'CLEANUP_LOCK_ACQUIRED=true\n' >> "$GITHUB_ENV"
          else
            echo 'Não foi possível adquirir o lock exclusivo; nada foi alterado.' >&2
            exit 1
          fi

      - name: Back up .htaccess and the database before any write
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          backup_dir="$LOCAWEB_ACCOUNT_ROOT/_uonix-cleanup-backups/$CLEANUP_RUN_ID"
          # BACKUP_DIR só é publicado DEPOIS de o dump ser validado: anunciar antes
          # faria o summary apontar um diretório cujo dump reprovou.
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" "$backup_dir" <<'REMOTE'
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"; backup_dir="$4"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }
          umask 077
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"

          cp -p "$document_root/.htaccess" "$backup_dir/htaccess.bak"
          test -s "$backup_dir/htaccess.bak"

          # `wp db export` NÃO funciona aqui: a Locaweb desabilita proc_open de
          # forma compilada. O dump direto é o único caminho confiável.
          #
          # O produtor é DETECTADO, não assumido: o preflight aceita mysqldump ou
          # mariadb-dump, e chamar `mysqldump` fixo faria um host só-MariaDB falhar
          # depois de já ter adquirido o lock.
          if command -v mysqldump >/dev/null 2>&1; then
            dump_bin="$(command -v mysqldump)"
          elif command -v mariadb-dump >/dev/null 2>&1; then
            dump_bin="$(command -v mariadb-dump)"
          else
            echo 'BACKUP_INVALIDO: nenhum produtor de dump disponível no host' >&2
            exit 1
          fi
          printf 'dump_bin=%s\n' "${dump_bin##*/}"

          dump="$backup_dir/db.sql.gz"
          sql_tmp="$backup_dir/db.sql.partial"
          rm -f -- "$sql_tmp"
          # EXIT cobre falhas normais. Nos sinais, `exit` é obrigatório: um handler
          # que apenas remove o arquivo retorna e pode deixar o script CONTINUAR.
          # O exit dispara o trap EXIT, que elimina o SQL completo em claro.
          cleanup_sql_tmp() { rm -f -- "$sql_tmp"; }
          trap cleanup_sql_tmp EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # O SQL físico e o gzip coexistem por alguns instantes. Reprovar antes do
          # dump se o filesystem não tiver ao menos 500 MB livres; não substitui a
          # quota da conta, mas evita esgotamento do volume visível pelo host.
          livre_kb="$(df -Pk "$backup_dir" | awk 'NR==2 {print $4}')"
          printf 'livre_kb=%s\n' "$livre_kb"
          [ "$livre_kb" -ge 500000 ] || {
            printf 'BACKUP_INVALIDO: espaço livre insuficiente (%s KB, mínimo 500000)\n' "$livre_kb" >&2
            exit 1
          }
          set -o pipefail
          # O footer `-- Dump completed` do cliente NÃO é confiável neste host: dois
          # runs reais terminaram com status zero sem emiti-lo, inclusive já com
          # --comments --dump-date. A prova de conclusão passa a ser um marcador
          # NOSSO anexado a um SQL físico DEPOIS de o produtor sair bem.
          #
          # Dois desenhos em stream foram refutados pela produção:
          # - 31046533827: o segundo membro gzip não apareceu na leitura;
          # - 31050726743: o marcador no mesmo pipeline também não apareceu.
          #
          # Sem pipeline no produtor não há status implícito para interpretar: com
          # `set -e`, rc != 0 aborta ANTES do append. A quebra de linha inicial
          # garante marcador autônomo mesmo se o cliente terminar sem newline.
          # --no-defaults precede TODAS as opções: sem ele, mysqldump lê ~/.my.cnf
          # e um `[mysqldump] no-data` (ou `where=1=0`) faz o produtor sair rc=0 com
          # ZERO dados, marcador presente e as 158 linhas CREATE TABLE intactas.
          # Auditoria provou isso em MariaDB 10.11 real; em host compartilhado o
          # painel cria esse arquivo, então não é preciso invasor.
          MYSQL_PWD="$(wp config get DB_PASSWORD)" "$dump_bin" \
            --no-defaults \
            --host="$(wp config get DB_HOST)" \
            --user="$(wp config get DB_USER)" \
            --single-transaction --quick --skip-lock-tables \
            --no-tablespaces --routines --triggers --events \
            --comments --dump-date \
            --default-character-set=utf8mb4 \
            "$(wp config get DB_NAME)" > "$sql_tmp"
          printf -- '\n-- UONIX_DUMP_COMPLETO\n' >> "$sql_tmp"
          gzip -c "$sql_tmp" > "$dump"
          rm -f -- "$sql_tmp"
          trap - EXIT HUP INT TERM

          # gzip -t valida o ENVELOPE, não o conteúdo: um dump interrompido produz
          # gzip íntegro. Exigir o nosso marcador como última linha não vazia é o
          # que prova que o produtor chegou ao fim. Filtra vazias antes do tail e
          # normaliza CRLF — janela fixa reprovaria dump legítimo.
          test -s "$dump"
          gzip -t "$dump"
          last="$(gzip -dc "$dump" | tr -d '\r' | grep -v '^[[:space:]]*$' | tail -n 1)"
          if [ "$last" != '-- UONIX_DUMP_COMPLETO' ]; then
            printf 'BACKUP_INVALIDO: dump sem marcador de conclusão (bytes=%s)\n' "${#last}" >&2
            exit 1
          fi
          # Marcador presente ainda não é cobertura: um dump que perdeu tabelas no
          # meio pode terminar bem. Conta as tabelas realmente presentes.
          #
          # A âncora inclui a crase de abertura. Sem ela `^CREATE TABLE` também casa
          # o corpo de uma ROUTINE, emitido verbatim por --routines: a auditoria
          # mediu um dump de 1 tabela real contando 121 "CREATE TABLE". Os gates de
          # volume abaixo cobrem o dump-casca, mas esta contagem é usada por si só
          # como piso de cobertura, então precisa ser difícil de inflar.
          tabelas="$(gzip -dc "$dump" | grep -c '^CREATE TABLE `' || true)"
          printf 'tabelas=%s\n' "$tabelas"
          [ "$tabelas" -ge 100 ] || {
            printf 'BACKUP_INVALIDO: apenas %s tabelas no dump (esperado >= 100)\n' "$tabelas" >&2
            exit 1
          }
          # Estrutura NÃO é dado. A contagem de CREATE TABLE é falsificável: o corpo
          # de uma ROUTINE é emitido verbatim por --routines, e a auditoria mediu um
          # dump de 1 tabela contando 121 "CREATE TABLE". Além disso um dump só de
          # estrutura tem todos os CREATE TABLE e nenhum dado. Medir VOLUME é o que
          # separa backup restaurável de casca vazia.
          inserts="$(gzip -dc "$dump" | grep -c '^INSERT INTO' || true)"
          bytes_sql="$(gzip -dc "$dump" | wc -c | tr -d '[:space:]')"
          printf 'inserts=%s bytes_sql=%s\n' "$inserts" "$bytes_sql"
          [ "$inserts" -ge 20 ] || {
            printf 'BACKUP_INVALIDO: apenas %s INSERT no dump; backup sem dados\n' "$inserts" >&2
            exit 1
          }
          [ "$bytes_sql" -ge 100000 ] || {
            printf 'BACKUP_INVALIDO: dump com apenas %s bytes; volume incompatível com produção\n' "$bytes_sql" >&2
            exit 1
          }
          echo 'BACKUP_VALIDO'
          chmod 600 "$dump" "$backup_dir/htaccess.bak"
          ls -la "$backup_dir"
          REMOTE
          # Só agora o diretório é publicado: o dump passou pelas três provas.
          printf 'BACKUP_DIR=%s\n' "$backup_dir" >> "$GITHUB_ENV"

      - name: Prove zero content usage before deleting
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          # wp eval, não wp db query: proc_open desabilitado faz db query falhar.
          # O PHP vai literal de propósito: $wpdb e as aspas escapadas são do PHP,
          # não expansão de shell.
          # shellcheck disable=SC2016
          used="$("$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" eval '
            global $wpdb;
            echo (int) $wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->posts}
              WHERE post_status=\"publish\" AND (
                post_content LIKE \"%socialfeed%\" OR
                post_content LIKE \"%sfeed%\" OR
                post_content LIKE \"%social-feed%\"
              )");')"
          printf 'posts_publicados_usando_alvos=%s\n' "$used"
          [ "$used" = 0 ] || {
            echo 'Há conteúdo publicado usando os plugins alvo; abortando sem remover.' >&2
            exit 1
          }
          REMOTE

      - name: Remove vendor plugins in a single remote session
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" "$LOCAWEB_WP_BIN" <<'REMOTE'
          set -uo pipefail
          document_root="$1"; php_bin="$2"; wp_bin="$3"
          wp() { "$php_bin" -d disable_functions= "$wp_bin" --path="$document_root" "$@"; }

          # UM laço numa única sessão SSH: remover como N invocações separadas fez
          # o host recusar a porta no meio, deixando o lote pela metade.
          # `-pro` antes do base. Desativar antes de apagar — a desativação é o
          # que limpa os blocos do plugin no .htaccess.
          failures=0
          for p in backuply-pro backuply \
                   fileorganizer-pro fileorganizer \
                   socialfeeds-pro socialfeeds \
                   softaculous-pro \
                   loginizer loginizer-security \
                   cookieadmin-pro cookieadmin \
                   formlayer-pro \
                   siteseo-pro siteseo \
                   speedycache-pro speedycache; do
            if ! wp plugin is-installed "$p" >/dev/null 2>&1; then
              echo "AUSENTE  $p"
              continue
            fi
            wp plugin deactivate "$p" >/dev/null 2>&1 || true
            if wp plugin delete "$p" >/dev/null 2>&1; then
              echo "REMOVIDO $p"
            else
              echo "FALHA    $p"
              failures=$((failures + 1))
            fi
          done

          echo '--- alvos restantes ---'
          wp plugin list --format=csv --fields=name,status \
            | grep -Ei '^(backuply|fileorganizer|socialfeeds|softaculous|cookieadmin|formlayer|siteseo|speedycache|loginizer)' \
            || echo 'NENHUM_ALVO_RESTANTE'
          echo '--- total de plugins ---'
          wp plugin list --format=csv --fields=name | tail -n +2 | wc -l

          [ "$failures" -eq 0 ]
          REMOTE

      - name: Rename misleading /painel markers without changing directives
        if: ${{ inputs.mode == 'execute' }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$LOCAWEB_DOCUMENT_ROOT" "$LOCAWEB_PHP_BIN" <<'REMOTE'
          set -euo pipefail
          document_root="$1"; php_bin="$2"
          htaccess="$document_root/.htaccess"
          old_begin='# BEGIN Loginizer'
          old_end='# END Loginizer'
          new_begin='# BEGIN UonixAdminPath (NAO REMOVER: serve a URL de admin /painel)'
          new_end='# END UonixAdminPath'

          test -s "$htaccess"
          # `grep -Fx` não casaria o marcador num arquivo CRLF (o \r final faz
          # parte da linha). A contagem canônica é feita pelo PHP, que faz rtrim
          # do \r; aqui só exigimos que o marcador exista de alguma forma.
          [ "$(grep -Fc "$old_begin" "$htaccess")" -ge 1 ]
          [ "$(grep -Fc "$old_end" "$htaccess")" -ge 1 ]

          tmp="${htaccess}.uonix-marker.$$"
          before="${tmp}.before"
          after="${tmp}.after"
          trap 'rm -f "$tmp" "$before" "$after"' EXIT

          # Terminadores medidos ANTES: o .htaccess real é LF e não termina em
          # newline. Converter CRLF<->LF faria o Apache reinterpretar o arquivo.
          cr_antes="$(tr -dc '\r' < "$htaccess" | wc -c | tr -d ' ')"
          printf 'CR_ANTES=%s\n' "$cr_antes"

          # A cópia preserva dono, grupo e modo. O original só é substituído
          # depois de todas as provas abaixo passarem.
          cp -p "$htaccess" "$tmp"
          # Comparação por LINHA, com rtrim do \r: casar o marcador com "\n"
          # colado falharia quando o bloco fosse a última linha de um arquivo sem
          # terminador final. Preserva o terminador original de cada linha.
          "$php_bin" -d disable_functions= -r '
            $path = $argv[1];
            $map  = [ $argv[2] => $argv[3], $argv[4] => $argv[5] ];
            $data = file_get_contents($path);
            if ($data === false) { exit(20); }
            $lines = explode("\n", $data);
            $hits  = [];
            foreach ($lines as $i => $line) {
              $bare = rtrim($line, "\r");
              if (isset($map[$bare])) {
                $hits[$bare] = ($hits[$bare] ?? 0) + 1;
                $eol = strlen($line) > strlen($bare) ? "\r" : "";
                $lines[$i] = $map[$bare] . $eol;
              }
            }
            foreach ($map as $old => $new) {
              if (($hits[$old] ?? 0) !== 1) { exit(21); }
            }
            $count = count($hits);
            if ($count !== 2) { exit(22); }
            $out = implode("\n", $lines);
            if (file_put_contents($path, $out) !== strlen($out)) { exit(23); }
          ' "$tmp" "$old_begin" "$new_begin" "$old_end" "$new_end"

          # Remove somente os dois comentários de cada lado e compara o resto.
          # O `tr -d '\r'` é aplicado apenas na EXTRAÇÃO para a comparação, para
          # que -Fvx case o marcador também em arquivos CRLF. O arquivo real
          # mantém seus terminadores — provado pela contagem de CR abaixo.
          tr -d '\r' < "$htaccess" | grep -Fvx -e "$old_begin" -e "$old_end" > "$before"
          tr -d '\r' < "$tmp" | grep -Fvx -e "$new_begin" -e "$new_end" > "$after"
          cmp -s "$before" "$after" || {
            echo 'Diretivas do /painel mudariam; abortando antes de substituir .htaccess.' >&2
            exit 1
          }
          # Também sem -Fx, pelo mesmo motivo do CRLF acima.
          [ "$(grep -Fc "$new_begin" "$tmp")" -ge 1 ]
          [ "$(grep -Fc "$new_end" "$tmp")" -ge 1 ]
          ! grep -Fq "$old_begin" "$tmp"
          ! grep -Fq "$old_end" "$tmp"
          # Terminadores idênticos: nenhuma conversão CRLF<->LF escapou.
          cr_depois="$(tr -dc '\r' < "$tmp" | wc -c | tr -d ' ')"
          [ "$cr_antes" = "$cr_depois" ] || {
            echo "Terminadores de linha mudariam ($cr_antes -> $cr_depois); abortando." >&2
            exit 1
          }

          mv -f "$tmp" "$htaccess"
          rm -f "$before" "$after"
          trap - EXIT
          echo 'UONIX_ADMIN_PATH_MARKERS_RENAMED'
          REMOTE

      - name: Validate the site after removal
        if: ${{ inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          # Amostragem repetida: um único 200 não distingue site saudável de
          # falha intermitente pós-remoção.
          probe() {
            local label="$1" path="$2" expected="$3" attempt=1 code
            while :; do
              code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 \
                -A 'uonix-cleanup-smoke/1.0' "${TARGET_URL}${path}")"
              if [ "$code" = "$expected" ]; then
                printf '  %-12s %s OK\n' "$label" "$code"
                return 0
              fi
              # Mod_Security responde 403/406/409 a tráfego automatizado em
              # caminhos de login e libera em ~180s; não é queda do site.
              case "$code" in
                403|406|408|409|429|5??)
                  if [ "$attempt" -ge 5 ]; then
                    echo "  $label respondeu $code em 5 tentativas" >&2
                    return 1
                  fi
                  sleep $((attempt * 15))
                  attempt=$((attempt + 1))
                  ;;
                *) echo "  $label respondeu $code (esperado $expected)" >&2; return 1 ;;
              esac
            done
          }
          probe home '/' '200'
          probe produtos '/produtos/' '200'
          probe login '/wp-login.php' '200'
          probe painel '/painel' '200'
          probe rest '/wp-json/' '200'

          echo 'Enumeração de usuários deve seguir bloqueada:'
          users="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$TARGET_URL/wp-json/wp/v2/users")"
          [ "$users" = 404 ] || { echo "  REST users respondeu $users; esperado 404" >&2; exit 1; }
          echo '  users 404 OK'

          echo 'Turnstile deve continuar no login e os plugins removidos não podem aparecer:'
          login_html="$(curl -sSL --max-time 30 "$TARGET_URL/wp-login.php")"
          printf '%s' "$login_html" | grep -qi turnstile || {
            echo '  Turnstile ausente do wp-login.php' >&2; exit 1; }
          echo '  turnstile presente OK'
          home_html="$(curl -sSL --max-time 30 "$TARGET_URL/")"
          for name in socialfeeds backuply fileorganizer siteseo cookieadmin softaculous loginizer; do
            if printf '%s' "$home_html" | grep -qi "$name"; then
              echo "  resíduo de $name no HTML" >&2
              exit 1
            fi
          done
          echo '  zero resíduo OK'

      - name: Release exclusive lock
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${CLEANUP_LOCK_ACQUIRED:-false}" != true ]; then
            echo 'Lock não foi adquirido nesta execução; nada a liberar.'
            exit 0
          fi
          lock_path="$LOCAWEB_DOCUMENT_ROOT/.uonix-operation.lock"
          sshpass -e ssh \
            -p "$LOCAWEB_SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/locaweb_known_hosts" \
            "$LOCAWEB_SSH_USER@$LOCAWEB_SSH_HOST" \
            bash -s -- "$lock_path" "$CLEANUP_RUN_ID" <<'REMOTE'
          set -uo pipefail
          lock_path="$1"; run_id="$2"
          # Não usa `set -e` com test: se o `owner` desaparecer, abortar aqui
          # deixaria o DIRETÓRIO órfão travando a próxima execução. Remove o que
          # é nosso, avisa no que for anômalo, e só falha se o diretório
          # pertencer a outra execução — aí apagar seria pior.
          if [ ! -d "$lock_path" ]; then
            echo 'Lock já não existe no host; nada a liberar.'
            exit 0
          fi
          if [ -f "$lock_path/owner" ]; then
            owner="$(cat "$lock_path/owner" 2>/dev/null || printf '')"
            if [ "$owner" != "$run_id" ]; then
              echo "AVISO: lock pertence a outra execução ($owner); não vou removê-lo." >&2
              exit 1
            fi
            rm -f -- "$lock_path/owner"
          else
            echo 'AVISO: lock sem arquivo owner; removendo diretório órfão.' >&2
          fi
          rmdir -- "$lock_path"
          echo 'Lock liberado.'
          REMOTE

      - name: Publish sanitized summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # Os backticks são markdown para o summary do run, não substituição de
          # comando: as aspas simples são deliberadas.
          # shellcheck disable=SC2016
          {
            printf '## Limpeza de plugins de fornecedor\n\n'
            printf -- '- Ambiente: `%s`\n' "$UONIX_REQUEST_ENVIRONMENT"
            printf -- '- Modo: `%s`\n' "$UONIX_REQUEST_MODE"
            printf -- '- Backup: `%s`\n' "${BACKUP_DIR:-nenhum (dry-run ou aborto antes da escrita)}"
            if [ -s inventory.txt ]; then
              printf -- '- Inventário coletado antes da decisão:\n\n```\n'
              cat inventory.txt
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
