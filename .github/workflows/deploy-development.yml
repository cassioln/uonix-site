name: Deploy Development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate before development deploy
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy development to HostGator
    needs: validate
    if: ${{ vars.ENABLE_DEPLOY_DEVELOPMENT == 'true' }}
    uses: ./.github/workflows/_deploy-hostgator.yml
    # Reusable workflows não herdam secrets automaticamente: sem esta linha,
    # secrets.HOSTGATOR_* resolvem para string vazia dentro do reusable e o
    # deploy falha ao montar o SSH (run 30670232135).
    secrets: inherit
    with:
      environment_name: development-hostgator
      target_root: ${{ vars.HOSTGATOR_DEV_ROOT }}
      target_url: ${{ vars.DEVELOPMENT_URL }}
      include_local_module: false
