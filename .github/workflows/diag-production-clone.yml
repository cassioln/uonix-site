name: DIAG production-clone secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production-clone
    steps:
      - name: Read-only auth test with production-clone secrets
        env:
          HOSTGATOR_SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          HOSTGATOR_SSH_KNOWN_HOSTS: ${{ secrets.HOSTGATOR_SSH_KNOWN_HOSTS }}
          LOCAWEB_SSH_PASSWORD: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          set +x
          echo "=== presenca dos 4 secrets ==="
          for v in HOSTGATOR_SSH_PRIVATE_KEY HOSTGATOR_SSH_KNOWN_HOSTS LOCAWEB_SSH_PASSWORD LOCAWEB_SSH_KNOWN_HOSTS; do
            eval "val=\${$v:-}"
            if [ -n "$val" ]; then echo "  $v: presente"; else echo "  $v: AUSENTE"; fi
          done
          echo "=== hash da senha Locaweb (deve ser 5a685587...) ==="
          printf '%s' "$LOCAWEB_SSH_PASSWORD" | sha256sum | cut -c1-16
          echo "=== ha ed25519 no known_hosts Locaweb? ==="
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" | grep -c ssh-ed25519 || true

          D="$RUNNER_TEMP/cred"; mkdir -p "$D"; umask 077
          printf '%s' "$LOCAWEB_SSH_PASSWORD" > "$D/lw-pass"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$D/lw-kh"
          printf '%s\n' "$HOSTGATOR_SSH_PRIVATE_KEY" > "$D/hg-key"; chmod 600 "$D/hg-key"
          printf '%s\n' "$HOSTGATOR_SSH_KNOWN_HOSTS" > "$D/hg-kh"

          sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true

          echo "=== AUTH Locaweb (prod) read-only ==="
          SSHPASS="$(cat "$D/lw-pass")" sshpass -e ssh \
            -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$D/lw-kh" -o ControlMaster=no -o ControlPath=none \
            -o ConnectTimeout=25 siteuonix1@ftp.uonix.com.br 'echo LOCAWEB_OK; whoami' 2>&1 | head -4
          echo "locaweb_exit=${PIPESTATUS[0]}"

          echo "=== AUTH HostGator (destino prod usa? nao — mas o clone abre HG tb) read-only ==="
          ssh -p 22 -i "$D/hg-key" \
            -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$D/hg-kh" -o ControlMaster=no -o ControlPath=none \
            -o ConnectTimeout=25 uonix@108.179.252.137 'echo HOSTGATOR_OK; whoami' 2>&1 | head -4
          echo "hostgator_exit=${PIPESTATUS[0]}"
