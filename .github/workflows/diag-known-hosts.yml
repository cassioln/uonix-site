name: DIAG known_hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: clone-operations
    steps:
      - name: Inspect LOCAWEB auth from runner (env=clone-operations)
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
          LOCAWEB_SSH_PASSWORD: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          KH="$RUNNER_TEMP/kh"
          printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$KH"
          echo "=== known_hosts tipos de chave (do env secret clone-operations) ==="
          awk '{print $2}' "$KH" | sort | uniq -c
          echo "=== ha ed25519? ==="
          grep -c ssh-ed25519 "$KH" || true
          echo "=== tamanho da senha do env secret (so o comprimento, nao o valor) ==="
          printf '%s' "$LOCAWEB_SSH_PASSWORD" | wc -c
          echo "=== IP de saida do runner ==="
          curl -s --max-time 10 https://api.ipify.org || echo "(sem curl/ip)"
          echo ""
          echo "=== instalar sshpass ==="
          sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq sshpass >/dev/null 2>&1 && echo "sshpass ok" || echo "falha instalando sshpass"
          echo "=== AUTH REAL do runner com a senha do env secret ==="
          PWF="$RUNNER_TEMP/pw"; printf '%s' "$LOCAWEB_SSH_PASSWORD" > "$PWF"
          SSHPASS="$(cat "$PWF")" sshpass -e ssh \
            -p 22 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KH" \
            -o ControlMaster=no -o ControlPath=none \
            -o ConnectTimeout=25 \
            siteuonix1@ftp.uonix.com.br 'echo AUTH_OK; whoami' 2>&1 | head -8
          rc=${PIPESTATUS[0]}
          echo "exit=$rc"
          if [ "$rc" = 0 ]; then
            echo "VEREDITO: senha do ENV SECRET FUNCIONA e IP do runner LIBERADO"
          else
            echo "VEREDITO: falhou -> ou senha do env secret errada, ou IP do runner bloqueado pela janela"
          fi
