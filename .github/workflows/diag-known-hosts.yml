name: DIAG known_hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: clone-operations
    steps:
      - name: Compare env-secret password hash vs known-good, and auth
        env:
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
          LOCAWEB_SSH_PASSWORD: ${{ secrets.LOCAWEB_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          echo "=== SHA256 da senha do ENV SECRET (compara com local 5a685587...) ==="
          printf '%s' "$LOCAWEB_SSH_PASSWORD" | sha256sum | awk '{print "env secret sha256:", $1}'
          printf '%s' "$LOCAWEB_SSH_PASSWORD" | wc -c | awk '{print "env secret bytes:", $1}'
          echo "LOCAL conhecido-bom:      5a685587e9487916d645009bdb892a0671d34ee2fc2262befe0ebfae02f86150"
          echo ""
          echo "=== ha espaco/CR/LF escondido no fim? (od dos ultimos 4 bytes) ==="
          printf '%s' "$LOCAWEB_SSH_PASSWORD" | tail -c 4 | od -An -c
          echo ""
          echo "=== IP de saida do runner ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo ""
          KH="$RUNNER_TEMP/kh"; printf '%s\n' "$LOCAWEB_SSH_KNOWN_HOSTS" > "$KH"
          sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true
          echo "=== AUTH real do runner ==="
          SSHPASS="$LOCAWEB_SSH_PASSWORD" sshpass -e ssh \
            -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KH" -o ControlMaster=no -o ControlPath=none \
            -o ConnectTimeout=25 siteuonix1@ftp.uonix.com.br 'echo AUTH_OK; whoami' 2>&1 | head -6
          echo "exit=${PIPESTATUS[0]}"
